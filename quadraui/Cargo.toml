[package]
name = "quadraui"
version = "0.0.1"
edition.workspace = true
description = "Cross-platform UI primitives with native Windows, Linux, macOS, and TUI rendering backends"
license.workspace = true
repository.workspace = true
# Matches `rust-toolchain.toml`'s pin exactly (see that file's header for why
# the pin exists at all — every stable release can ship new clippy lints and
# this repo runs `-D warnings`). Keeping the two in lockstep means an older
# rustc gets cargo's own "package `quadraui` requires rustc 1.97.1 or newer"
# error instead of an opaque parse/feature failure deep in compilation.
# Bumping the toolchain pin and this field is one commit, not two — do them
# together.
rust-version = "1.97.1"

# docs.rs builds every optional feature (`tui`/`gtk`/`macos`/`win`/`terminal`)
# so a published crate actually renders all backends' public API instead of
# just the always-on core (none of them are default features — see the
# `[features]` table below). `rustdoc-args` sets `--cfg docsrs`, which is what
# `src/lib.rs`'s `#![cfg_attr(docsrs, feature(doc_cfg))]` and each
# feature-gated `pub mod`'s `#[cfg_attr(docsrs, doc(cfg(feature = "...")))]`
# key off of, so the rendered docs show each backend module's feature
# requirement instead of silently omitting it.
#
# Deliberately no `targets`/`default-target` override here to add a macOS or
# Windows build: `macos` is the only feature in this list that actually needs
# a non-Linux target to render real content (`lib.rs` gates `mod macos` on
# `target_os = "macos"` too, not just the feature — see that arm's comment),
# but `gtk` — also in this list — is a REAL system dependency (gtk4 via
# pkg-config, unlike the pure-Rust-binding `objc2`/`windows` crates), and
# docs.rs applies one global feature set to every target in `targets`; there
# is no per-target feature split available in this table. Adding an
# `aarch64-apple-darwin` target here would make docs.rs try to compile
# `quadraui::gtk` for that target with no system gtk4 in its build sandbox,
# failing the crate's ENTIRE docs.rs build rather than just omitting macOS's
# page. `win` has no such problem: `src/win/` is not target-gated at all
# (only the real WinAPI calls inside it are, with a `todo!()` fallback — see
# the `win` feature's comment above), so it already renders under the
# default Linux target with no extra target needed. Real macOS doc coverage
# instead comes from `.github/workflows/macos.yml`'s `Doc (macos feature)`
# step, which runs `cargo doc --features macos` for real on a `macos-latest`
# runner.
[package.metadata.docs.rs]
features = ["tui", "gtk", "win", "terminal", "macos"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]

[features]
# PTY + vt100 + scrollback engine. No rasteriser — pairs with any backend.
# Enables `quadraui::terminal_engine`. Pulls in portable-pty and vt100.
terminal = ["dep:portable-pty", "dep:vt100"]

# Public TUI rasterisers in `quadraui::tui`. Pulls in ratatui.
# `dep:trash` (issue #956): `PlatformServices::move_to_trash` — see
# `desktop::move_to_trash`'s doc for why the same cross-platform `trash`
# crate backs every backend's override, TUI included.
# `dep:keyring` (issue #958): `PlatformServices::secret_store` — see
# `backend::KeyringSecretStore`'s doc for why the same cross-platform
# `keyring` crate backs every backend's default, TUI included (this is
# the one Electron-parity capability that needs no window, no display
# server, and no desktop session).
tui = ["dep:ratatui", "dep:arboard", "dep:trash", "dep:keyring"]

# Public GTK rasterisers in `quadraui::gtk`. Pulls in gtk4 + pangocairo.
# `arboard/image-data` (issue #954): `GtkClipboard::read_image`/
# `write_image` need arboard's `get_image`/`set_image`, which are
# `#[cfg(feature = "image-data")]` inside arboard itself. Enabling it
# only here (not on the bare `tui` feature below) keeps a `tui`-only
# build's dependency footprint exactly what it was before #954 — see
# `arboard`'s own dependency comment for why that footprint was
# deliberately kept minimal.
# `dep:trash` (issue #956) / `dep:keyring` (issue #958): see `tui`'s own
# comments above — same crates, same reasons.
gtk = [
    "dep:gtk4",
    "dep:pangocairo",
    "dep:arboard",
    "arboard/image-data",
    "dep:trash",
    "dep:keyring",
]

# Public Win-GUI rasterisers in `quadraui::win`. `windows` is a
# target-specific optional dependency (see the
# `[target.'cfg(target_os = "windows")'.dependencies]` table below),
# same pattern as `macos`'s objc2 family — `dep:windows` unifies fine
# on non-Windows hosts where the dependency simply doesn't exist.
# `#19` landed the Win32 window + Direct2D render-target bootstrap in
# `src/win/run.rs` / `src/win/backend.rs`, gated internally on
# `cfg(target_os = "windows")` so `cargo check --features win` keeps
# type-checking `WinBackend`'s trait-completeness on Linux (the whole
# point of the ubuntu "win compile gate" in ci.yml — see its comment)
# without needing a real WinAPI. Most `Backend::draw_*` methods are
# still `todo!()` stubs — later issues implement each rasteriser.
# `dep:trash` (issue #956) / `dep:keyring` (issue #958): see the `tui`
# feature's comments above — same crates, same reasons.
win = ["dep:windows", "dep:windows-numerics", "dep:trash", "dep:keyring"]

# Legacy alias kept so `cargo run --example gtk_demo --features gtk-example`
# keeps working as a deprecated spelling. Prefer `--features gtk` going
# forward — both gtk_demo and gtk_app now go through `quadraui::gtk::run`.
gtk-example = ["gtk"]

# Public macOS rasterisers in `quadraui::macos` (AppKit + Core Graphics + Core Text).
# The objc2-family deps are platform-gated below, but that's not the only
# gate: `lib.rs` also cfg's `mod macos` on `target_os = "macos"`, so on a
# non-macOS host `cargo check --features macos` compiles NONE of
# `src/macos/` — it exits 0 having proven nothing, not "type-checked".
# The real gate is `.github/workflows/macos.yml`: a `macos-latest` runner
# that builds and tests this feature for real, triggered by any PR
# touching `quadraui/src/macos/**` (see that workflow's header for why
# it isn't wired to run on Linux/CI at all).
macos = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:core-graphics",
    "dep:core-text",
    "dep:core-foundation",
    "dep:foreign-types",
    "dep:arboard",
    # `MacClipboard::read_image`/`write_image` (#954) — see `gtk`'s
    # matching comment above; same reasoning, same arboard feature.
    "arboard/image-data",
    "dep:dispatch2",
    # `dep:trash` (issue #956) / `dep:keyring` (issue #958): see the `tui`
    # feature's comments above — same crates, same reasons.
    "dep:trash",
    "dep:keyring",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Unconditional (not feature-gated): `Theme::from_vscode_json` (#775)
# parses VS Code theme JSON in the core `theme` module, which every
# backend feature builds — not just `tui`/`gtk`. Previously only a
# dev-dependency (used by `#[cfg(test)]` round-trip tests across
# `src/primitives/*`); this promotes it to a real dependency so the same
# crate/version is available outside `#[cfg(test)]` too.
serde_json = "1.0"
# Optional — pulled in by the `gtk` / `gtk-example` features.
gtk4 = { version = "0.11", features = ["v4_10"], optional = true }
# Bumped alongside gtk4 (#796): pangocairo/pango/glib are one version
# family with gtk4-rs — pairing gtk4 0.11 with pangocairo 0.18 resolves
# two incompatible `glib`/`pango` majors side by side (glib-sys 0.18 vs
# 0.22), which fails to compile the moment gtk4 and pangocairo types
# meet (e.g. handing a `gtk4`-sourced cairo context to pangocairo).
pangocairo = { version = "0.22", optional = true }
# Optional — pulled in by the `tui` feature.
ratatui = { version = "0.30", optional = true }
# Unconditional (not feature-gated): `StyledText::visible_width` in the
# core `types` module needs real cell-width measurement, not just
# `tui`/`gtk`'s rasterisers — see #471. Kept at the loosest bound
# quadraui itself actually needs ("0.2", i.e. >=0.2.0) rather than
# pinned to whatever patch version happened to resolve at bump time —
# see /README-PATCH.md (#452, #795) for why a tighter bound here would
# NOT have prevented vt100's old unicode-width conflict anyway (vt100's
# own manifest was the binding constraint, not this line) — and why
# that conflict, and the `[patch.crates-io]` vendored shim it once
# required, are both gone now.
unicode-width = "0.2"
# Optional — pulled in by `tui`, `gtk`, and `macos` for system clipboard
# access. `default-features = false`: arboard's defaults pull in
# `image-data` (and transitively `image` 0.25) unconditionally (#796).
# quadraui's `tui` feature genuinely never needs it — TUI's clipboard is
# text-only by design (OSC 52 has no image form, #954) — so it stays off
# there; `gtk` and `macos` turn it back on explicitly (`arboard/image-data`
# on each of those features, above) since `GtkClipboard`/`MacClipboard`
# do use `get_image`/`set_image` for `Clipboard::read_image`/`write_image`
# (#954). A `tui`-only build's dependency footprint is unaffected.
arboard = { version = "3", optional = true, default-features = false }
# Optional — pulled in by the `terminal` feature.
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }
# Optional — pulled in by `tui`, `gtk`, `macos`, and `win` (issue #956):
# `PlatformServices::move_to_trash`'s one shared implementation across
# every backend (`desktop::move_to_trash`). Cross-platform (Linux
# freedesktop.org trash spec, macOS `NSFileManager
# -trashItemAtURL:resultingItemURL:error:`, Windows
# `SHFileOperationW(FOF_ALLOWUNDO)`) and genuinely needs only a
# filesystem, not a live desktop/window-server session, which is why TUI
# pulls it too instead of degrading to `Unsupported` the way TUI's other
# desktop-shell-flavoured `PlatformServices` methods do. Its own
# `windows`-crate (0.62) and `objc2`/`objc2-foundation` (0.6/0.3)
# transitive versions already match this crate's own `win`/`macos`
# dependencies exactly, so enabling it alongside them unifies rather than
# duplicating either dependency graph.
trash = { version = "5", optional = true }
# Optional — pulled in by `tui`, `gtk`, `macos`, and `win` (issue #958):
# `PlatformServices::secret_store`'s one shared implementation across
# every backend (`backend::KeyringSecretStore`) — see that type's own doc
# for why no backend needs its own override. Default features (`v1`)
# unify macOS Keychain, Windows Credential Manager, and Linux Secret
# Service (over D-Bus via the pure-Rust `zbus` client — no `libdbus`,
# no GUI toolkit, no display server) behind one `keyring::Entry` API,
# which is exactly the `get`/`set`/`delete`-by-service-and-account shape
# `SecretStore` wraps. Same "genuinely needs only a background service
# session, not a live desktop" reasoning as `trash`'s own comment above,
# which is why this pulls in on TUI too instead of degrading.
keyring = { version = "4", optional = true }

# macOS-only optional deps. Gated on `target_os = "macos"` so the `macos`
# feature is a no-op on other platforms — keeps cross-platform CI green.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSRunningApplication",
    "NSGraphicsContext",
    "NSGraphics",
    "NSColor",
    "NSEvent",
    # quadraui#936: `NSAlert`-backed `show_message_dialog`. `NSAlert`
    # itself needs "NSAlert"; `addButtonWithTitle:`/`setKeyEquivalent:`
    # (an `NSButton` per alert button) need "NSButton" + "NSControl" on
    # top of the "NSResponder" + "NSView" already listed above.
    #
    # quadraui#947 leans on the same three: `NSWindow`'s
    # `standardWindowButton:` (used to measure the inset AppKit's traffic
    # lights reserve in a client-side titlebar) is cfg'd
    # all(feature = "NSButton", feature = "NSControl", feature = "NSView")
    # because it returns an `NSButton`. Both are cfgs on the *method*, so
    # tests/macos_appkit_features.rs's per-symbol map can't guard them —
    # do not drop "NSButton"/"NSControl" on the grounds that no import
    # names them.
    "NSAlert",
    "NSButton",
    "NSControl",
    # `objc2-app-kit` gates every generated class behind a same-named
    # feature: without this one, `objc2_app_kit::NSCursor` simply does not
    # exist and `macos::backend`'s `set_cursor` / `mac_cursor_for_shape`
    # (#498) fail to resolve. Invisible on Linux — `src/macos` is gated on
    # `target_os = "macos"` in `lib.rs`, so only the `macOS` workflow's
    # `macos-latest` runner ever compiles the import.
    "NSCursor",
    "NSCell",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSSavePanel",
    # Issue #834 (OS file drop): `NSDraggingDestination`/`NSDraggingInfo`/
    # `NSDragOperation` (`draggingEntered:`/`performDragOperation:` on
    # `QuadraView`) and the pasteboard types they read the dropped file
    # URLs from.
    "NSDragging",
    "NSPasteboard",
    "NSPasteboardItem",
    # `system_theme` (#952): `NSAppearance`/`effectiveAppearance` for
    # light/dark, `NSWorkspace::accessibilityDisplayShouldIncreaseContrast`
    # for high contrast.
    #
    # "NSAppearance" is load-bearing but guarded by NOTHING in
    # tests/macos_appkit_features.rs — `src/macos/` imports no
    # `objc2_app_kit::NSAppearance*` symbol. Both methods `system_theme`
    # calls (`NSApplication::effectiveAppearance` and `NSAppearance::name`)
    # are *inherent* methods cfg-gated on this feature, reached through the
    # returned value, so there is no import for that test's map to key on
    # (same inexpressible shape as the "NSButton"/"NSControl" note above).
    # Dropping it compiles fine everywhere in this fleet and fails only on
    # macos-latest. See that test's `NSApplication` row for the long form.
    #
    # `NSColor::controlAccentColor` itself needs no new
    # feature ("NSColor" is already listed above), but reading its RGB
    # components back out via `getRed:green:blue:alpha:` does: that method
    # (and `redComponent`/`greenComponent`/`blueComponent`) is cfg-gated
    # inside `objc2-app-kit` itself on its own `objc2-core-foundation`
    # feature (the crate that defines the `CGFloat` type those methods
    # return), which is not implied by "NSColor" alone.
    "NSAppearance",
    "NSWorkspace",
    "objc2-core-foundation",
    # `mac_accent_color` (#952 review follow-up): `controlAccentColor` is a
    # dynamic/catalog system color, not guaranteed pre-resolved to an
    # RGB-compatible color space in every runtime context. Calling
    # `getRed:green:blue:alpha:` on a non-RGB color raises
    # `NSInvalidArgumentException`, and an ObjC exception unwinding across
    # this Rust/FFI boundary is UB. "NSColorSpace" gates
    # `colorUsingColorSpace:`, used to defensively convert to sRGB first.
    "NSColorSpace",
    # Issue #953 (tray/status-bar icon): `NSStatusBar::systemStatusBar`/
    # `statusItemWithLength:` and the `NSStatusItem` it returns.
    "NSStatusBar",
    "NSStatusItem",
    # `NSStatusItem::button(mtm)` — the clickable/imaged control inside
    # the status item — additionally needs "NSButton"/"NSControl"/
    # "NSResponder"/"NSView" (all already enabled above) on top of this
    # one, per that method's own `cfg(all(...))` in `objc2-app-kit`.
    "NSStatusBarButton",
    # `TrayService::set_icon`'s `NSImage::initWithData`/
    # `initWithContentsOfFile`, and `NSStatusBarButton::setImage`.
    "NSImage",
    # `PlatformServices::displays` (#959): `NSScreen::screens`/`frame`/
    # `visibleFrame`/`backingScaleFactor`. `cursor_screen_point` needs no
    # feature of its own beyond the "NSEvent" already enabled above —
    # `NSEvent::mouseLocation` is a bare class method on that same class.
    "NSScreen",
] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    # Issue #953 (tray/status-bar icon): `NSData::with_bytes` feeds
    # `NSImage::initWithData` when `TrayService::set_icon` is handed an
    # `ImageSource::Bytes`.
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSURL",
] }
core-graphics = { version = "0.23", optional = true }
core-text = { version = "20.1", optional = true }
core-foundation = { version = "0.9", optional = true }
# Issue #929: `CGFont::as_ptr()` (needed to hand a raw `CGFontRef` to
# `CTFontManagerRegisterGraphicsFont` — `macos::text::register_font_from_memory`)
# is a `foreign_types::ForeignType` trait method, and Rust only resolves trait
# methods from crates in the caller's own dependency graph, not merely
# transitively present ones — `core-graphics` already depends on the same
# `foreign-types` 0.5.0 to implement `CGFont` itself (see its own
# `Cargo.toml`), so this adds no new version to the dependency graph, only a
# direct name for `macos::text` to spell the trait with. Same "already
# resolved transitively, just need our own name for it" rationale as
# `windows-numerics` below for the `win` feature.
foreign-types = { version = "0.5", optional = true }
# Issue #831: `DispatchQueue::main().exec_async` is the safe, GCD-native
# "run this on the main thread" primitive `MacBackend::waker` uses to wake
# a background-thread-queued `UiEvent::User` — same purpose as `glib::
# MainContext::invoke` on GTK and `PostMessageW` on Win. `MainThreadBound`
# (also from this crate) is what lets `waker()`'s `Send + Sync` closure
# carry a handle to the `!Send` `QuadraView` across that boundary soundly.
dispatch2 = { version = "0.3", optional = true }

# Windows-only optional dep. Gated on `target_os = "windows"` so the `win`
# feature is a no-op on other platforms (mirrors the macOS block above).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    # DirectWrite text infrastructure (#21): `IDWriteFactory` /
    # `IDWriteTextFormat` / `IDWriteTextLayout` / font-collection metrics
    # lookups in `src/win/text.rs`, plus `ID2D1RenderTarget::DrawText` /
    # `DrawTextLayout` — both cfg-gated inside the `windows` crate itself
    # on this same feature (see that crate's `Direct2D/mod.rs`).
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # WIC (#739): `IWICImagingFactory`/`IWICBitmapDecoder`/
    # `IWICFormatConverter` in `src/win/image.rs`'s `draw_image` — decodes
    # PNG/JPEG/... bytes to a pixel buffer Direct2D can consume via
    # `ID2D1RenderTarget::CreateBitmapFromWicBitmap` (that method, and
    # `ID2D1DeviceContext::CreateBitmapFromWicBitmap`, are both cfg-gated
    # inside the `windows` crate itself on this same feature — see that
    # crate's `Direct2D/mod.rs`). `HeadlessSurface` (`src/win/testing.rs`)
    # deliberately does *not* need this: its `ID2D1DCRenderTarget` is a
    # paint destination built from a `CreateDIBSection` DC, not decoded
    # image content — see that module's doc for why a WIC bitmap render
    # target would have been the wrong (COM-heavier) tool for that job.
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    # `GetKeyState` + `VK_*` — issue #20's per-message modifier reads
    # (`win::run`'s `win_key_modifiers`). Not bundled into
    # `Win32_UI_WindowsAndMessaging`; `WM_*`/`MK_*` live there but the
    # virtual-key API is its own binding-crate feature.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Platform services (#23, `src/win/services.rs`): clipboard
    # (`OpenClipboard`/`GetClipboardData`/`SetClipboardData` +
    # `GlobalAlloc`/`GlobalLock` for the `CF_UNICODETEXT` payload), native
    # file dialogs (`IFileOpenDialog`/`IFileSaveDialog` via COM), a
    # `Shell_NotifyIconW` balloon-tip notification, and `ShellExecuteW`
    # for `open_url`.
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # `CF_UNICODETEXT` itself lives in `Ole`, not `DataExchange` — see
    # that crate module's `pub const CF_UNICODETEXT`.
    "Win32_System_Ole",
    "Win32_UI_Shell",
    # `COMDLG_FILTERSPEC` (file-type filters for `IFileDialog::SetFileTypes`).
    "Win32_UI_Shell_Common",
    # `TaskDialogIndirect`/`TASKDIALOGCONFIG`/`TASKDIALOG_BUTTON` (#744):
    # `show_message_dialog`'s native alert. This is the module gate the
    # `windows` crate puts around all of `Win32::UI::Controls` (see that
    # crate's `Win32/UI/mod.rs`) — `TaskDialogIndirect` itself is also
    # gated on `Win32_UI_WindowsAndMessaging`, already present above.
    "Win32_UI_Controls",
    # `CreateMutexW` (issue #957): `win::RunConfig::single_instance`'s
    # single-instance guard, checked before opening a window. `WM_COPYDATA`
    # itself, its `COPYDATASTRUCT` payload struct, and the `FindWindowW`/
    # `SendMessageW`/`SetForegroundWindow` calls that forward `argv` to an
    # already-running instance's window are all already covered by
    # `Win32_System_DataExchange`/`Win32_UI_WindowsAndMessaging` above.
    "Win32_System_Threading",
    # `CreateMutexW` itself is gated on this feature inside the `windows`
    # crate (its `lpmutexattributes: Option<*const SECURITY_ATTRIBUTES>`
    # parameter type lives here) even though this crate always passes
    # `None` for it — no actual `SECURITY_ATTRIBUTES` value is ever built.
    "Win32_Security",
    # `MessageBeep` (issue #956, `win_beep`) — lives at
    # `Win32::System::Diagnostics::Debug::MessageBeep` (a `windows`-crate
    # module-placement quirk, not a debugging API). Both this and its
    # parent `Diagnostics` module are separately feature-gated inside the
    # `windows` crate, so both features are needed even though
    # `Win32_UI_WindowsAndMessaging` (already present above, for
    # `MESSAGEBOX_STYLE`/`MB_OK`) is the only *other* feature the call
    # needs.
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    # `system_theme` (#952): WinRT (not Win32) `UISettings`/
    # `AccessibilitySettings` in the `Windows.UI.ViewManagement` namespace —
    # `UISettings::GetColorValue` for background/accent colour,
    # `AccessibilitySettings::HighContrast` for the high-contrast flag. No
    # separate `Win32_UI_Accessibility`/SPI feature needed: both classes
    # live in this one WinRT namespace.
    "UI_ViewManagement",
] }
# `windows_numerics::Vector2` — the point type `ID2D1RenderTarget::DrawLine`/
# `DrawEllipse`'s `D2D1_ELLIPSE` take (issue #26's chart line paths and hover
# marker). `windows` 0.62 moved these off its own `D2D_POINT_2F` onto this
# separate crate (see its own `Cargo.toml`'s `[dependencies.windows-numerics]`,
# a *mandatory*, not optional, dependency of `windows` itself) but does not
# re-export the type publicly, so a caller constructing one needs its own
# dependency on the same version rather than reaching through `windows::`.
# Already resolved transitively by `windows` itself (see Cargo.lock), so this
# adds no new version to the dependency graph — only a direct name for
# `src/win/chart.rs`/`src/win/text.rs` to spell the type with. `optional`
# + bundled into the `win` feature (see this crate's `[features]` block),
# matching `windows` itself: a no-op on non-Windows hosts.
windows-numerics = { version = "0.3", optional = true }

[dev-dependencies]
# For runnable examples that demonstrate the TUI backend pattern.
crossterm = "0.29"
# For isolated temp-directory creation in compose-controller tests
# that touch the filesystem.
tempfile = "3"
# For `tests/backend_todo_gate.rs` (quadraui#923): parses each backend's
# source with a real Rust grammar instead of line-adjacency regex, so
# `#[cfg(...)]` attribute-to-statement/item binding is resolved the way
# rustc actually resolves it. "visit" for the `syn::visit::Visit` walker,
# "full" for statement/expression syntax (attribute macros aren't enough —
# this needs `ExprMacro`, `ItemFn`, `ImplItemFn`, `Local`, etc.).
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# `ToTokens` — only used to render an unrecognised `#[cfg(...)]` predicate
# back into readable source text for the guard's failure message.
quote = "1"
# `span-locations` gives real line numbers from a standalone `parse_file`
# call (outside an actual proc-macro invocation, spans are otherwise
# call-site-only with no line info) — needed so a failure names a line a
# human can jump to instead of just a byte-order description.
proc-macro2 = { version = "1", features = ["span-locations"] }

