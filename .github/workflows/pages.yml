name: Deploy site

# Builds the mdBook site in `site/` and deploys it to GitHub Pages
# (quadraui#1349). Runs on pushes to `develop` only — this repo's GitHub
# default branch (see CLAUDE.md's "Branching + releases": `main` only
# moves via a reviewed `develop` -> `main` promotion, so `develop` is
# where "the latest" actually lives day to day) — never on a PR or any
# other branch, so an in-progress feature branch never clobbers the
# live site, and a fork's PR never needs Pages permissions at all.
#
# Four generated inputs feed the site, none of them hand-maintained
# per-widget (CLAUDE.md's "Demos are mandatory" rule, one level up):
#   1. `quadraui-gallery --dump-registry` — every demo's name, group,
#      variants and `// gallery:begin`/`// gallery:end` code region
#      (`quadraui-gallery/src/site_export.rs`).
#   2. `quadraui-gallery --capture` — one SVG per (demo, variant) on
#      this runner's TUI backend, plus `manifest.json` describing every
#      other backend as `unsupported`/`capture-pending`
#      (`quadraui-gallery/src/capture.rs`). Ubuntu has no GTK/Windows
#      headless driver yet (see that module's own doc), so this leg
#      itself only captures the TUI column.
#   3. The macOS column comes from `macos.yml`'s `gallery-capture-macos`
#      job (one PNG per demo/variant through the real Core Graphics
#      backend), uploaded there as the `gallery-capture-macos` artifact
#      and downloaded here — Ubuntu cannot run the macOS backend, so the
#      only way macOS screenshots reach the site is from that macos-latest
#      job's artifact. It refreshes on `macos.yml`'s weekly develop cron,
#      so the macOS column can lag the TUI column by up to a week; for a
#      widget gallery that is acceptable and far better than a "Pending"
#      column (quadraui#1619).
#   4. `tools/site_gen.py` merges (1), (2) and (3) into `site/src/gallery/`
#      and `site/src/SUMMARY.md` (its `--capture` is repeatable and keys
#      rows by `(demo, group, variant, backend)`, preferring a real
#      capture over a pending row), which `mdbook build` then turns into
#      the deployed HTML alongside the hand-maintained
#      `site/src/introduction.md` / `site/src/getting-started.md`.
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read

# Only one Pages deployment at a time; a second push while one is still
# building supersedes the queued one rather than racing it (the opposite
# of CI's own per-ref concurrency groups, since Pages has exactly one live
# target, not one per branch/PR). `cancel-in-progress` stays `false`
# deliberately: GitHub's own Pages guidance is not to cancel an
# in-progress production deployment (`deploy-pages` mid-flight can leave
# the environment with a pending deployment); queuing the newest run
# behind it gets the same "newest wins" outcome without aborting one that
# is already live.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    # #1292-style sizing: a `tui`-feature gallery build + capture run +
    # one `mdbook build` over ~40 generated pages, normally a few
    # minutes once the toolchain/cache steps are warm.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned in rust-toolchain.toml; see that file's own
      # header for why this Action's "default" isn't what actually pins
      # the version used below.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Downloads a prebuilt mdbook binary instead of `cargo install
      # mdbook` (which compiles from source and adds several minutes to
      # every run for a tool this workflow only *invokes*, never
      # modifies).
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Dump demo registry
        run: |
          mkdir -p target/site
          cargo run -p quadraui-gallery --bin quadraui-gallery --features tui -- \
            --dump-registry target/site/registry.json

      - name: Capture demo screenshots (TUI)
        run: |
          cargo run -p quadraui-gallery --bin quadraui-gallery --features tui -- \
            --capture target/site/capture-tui

      # macOS captures can't be produced on this Ubuntu runner (the macOS
      # backend only compiles/runs under `target_os = "macos"`), so pull
      # the PNGs from `macos.yml`'s `gallery-capture-macos` job — the one
      # macos-latest leg that renders every demo through the real Core
      # Graphics backend. We take its newest *develop* artifact (refreshed
      # by that workflow's weekly cron; its PR runs are head-ref-scoped and
      # not wanted here). `if_no_artifact_found: warn` is deliberate: if no
      # macOS artifact exists yet, the site still builds TUI-only rather
      # than failing the whole deploy — the macOS column simply falls back
      # to the "pending" rows site_gen.py already emits (quadraui#1619).
      - name: Download macOS gallery captures
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: macos.yml
          branch: develop
          name: gallery-capture-macos
          path: target/site/capture-macos
          if_no_artifact_found: warn

      # The macOS `--capture` dir is added only when its manifest actually
      # arrived: `site_gen.py` hard-errors (FileNotFoundError) on a
      # `--capture` dir with no `manifest.json`, so an empty/absent macOS
      # download must drop the argument rather than pass a path that isn't
      # there. Dropping it is the correct fallback, not a degraded one —
      # the TUI capture's own manifest already describes macOS as
      # `capture-pending`, so the macOS column renders exactly as it does
      # today (pending), never a broken build (quadraui#1619).
      - name: Generate gallery pages
        run: |
          extra=()
          if [ -f target/site/capture-macos/manifest.json ]; then
            extra+=(--capture target/site/capture-macos)
          else
            echo "::warning::no gallery-capture-macos manifest; macOS column stays pending"
          fi
          python3 tools/site_gen.py \
            --registry target/site/registry.json \
            --capture target/site/capture-tui \
            "${extra[@]}" \
            --out site/src

      - name: Build mdBook
        run: mdbook build site

      # No `actions/configure-pages@v5` step here: that action's only
      # output is `base_url`/`origin` metadata, neither of which this job
      # passes to `mdbook build` (mdBook needs no runtime base-path
      # injection the way some static-site generators do), and the action
      # itself calls `GET /repos/{owner}/{repo}/pages`, which needs the
      # `pages: write` permission this job deliberately does not hold
      # (that scope lives on the `deploy` job below, which is the one
      # that actually talks to the Pages API). Running it here would just
      # add a permission this job has no other reason to need.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
