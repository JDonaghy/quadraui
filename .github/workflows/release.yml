name: Release

# Releases `quadraui` on every push to `main` that carries a version bump,
# then creates the matching GitHub release from CHANGELOG.md's `## [X.Y.Z]`
# section. `main` only ever moves via a reviewed, CI-green `develop` -> `main`
# promotion PR (see CLAUDE.md's "Branching + releases"), so that promotion —
# not a hand-pushed tag — is the release trigger (#1368). Most promotions
# don't bump the version, so most runs here are a fast no-op: see the `check`
# job below.
#
# Publishing uses crates.io Trusted Publishing: `crates-io-auth-action`
# exchanges this job's GitHub OIDC identity for a ~30-minute token scoped to
# the crates configured on crates.io, so no long-lived API token is stored
# anywhere. crates.io's trusted-publisher entry for `quadraui` names this
# file (`release.yml`) and the `release` environment — renaming either breaks
# publishing until the crates.io side is updated to match.
#
# The `release` environment requires a reviewer's approval and is scoped to
# the `publish` job only (not `check`), so a no-op push to `main` finishes in
# a couple of minutes with nobody paged, and a real version bump still
# queues the publish for a human to approve rather than running it
# unattended.
#
# OPERATOR ACTION REQUIRED before the first `main` promotion under this
# workflow: the `release` environment's GitHub-side "deployment branches and
# tags" rule was configured for the old tag-triggered workflow and almost
# certainly still restricts deployments to `v*` tags only. That rule lives
# in the repo's Settings -> Environments UI, not in this file, so replacing
# the `tags: ["v*"]` trigger below with `branches: [main]` does NOT change
# it — a `publish` run against `refs/heads/main` will be refused with
# "Branch main is not allowed to deploy to release due to environment
# protection rules" until an operator changes that rule to allow the `main`
# branch (and, separately, checks whether a `v*` tag-protection ruleset
# exists that would also need a bypass for the Actions token's
# `git push origin "${TAG}"` below). Do this before merging the `develop` ->
# `main` PR that is meant to exercise this workflow for the first time.
on:
  push:
    branches: [main]

# Keyed on the workflow, not `github.ref` — every push to `main` shares one
# group, so two quick `develop` -> `main` promotions queue strictly one after
# another instead of racing two `cargo publish`/tag-push attempts. Each
# `main` push is a discrete release decision, not a stream of superseding
# commits (the opposite of e.g. a PR's own build-the-latest-push model), so
# `cancel-in-progress: false` is load-bearing: cancelling a queued run could
# throw away a version bump that was pushed first and got queued behind one
# that pushed second but happened to be a no-op.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    # No `environment:` here deliberately — this job must run unattended and
    # fast on every push to `main`, including the common case where the
    # version wasn't bumped. Gating it behind the same reviewer approval as
    # `publish` would mean every merge to `main` pages a human, defeating the
    # whole point of distinguishing "no-op" from "release" before the
    # approval-gated job even starts.
    name: Check whether this push bumps the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml; rustup's override
      # resolution honors that file regardless of what this action installs
      # as its default, so this reads the version with the same 1.97.1 as CI.
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the quadraui crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "quadraui") | .version')
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::cargo metadata returned an empty or malformed quadraui version: '${version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # `decide` queries the remote directly (`git ls-remote --tags origin`),
      # not this shallow checkout's local refs — a depth-1 clone has no tag
      # objects at all, so a local-only check would always read "missing"
      # and try to re-create a tag that already exists upstream. See
      # `scripts/release_decide.py`'s module doc and
      # `scripts/test_release_decide.py` for the three branches this covers.
      - name: Decide no-op vs. publish (tag v<version> exists on origin?)
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_decide.py decide --version "${VERSION}"

      # Fails fast, in this unattended job, rather than only after a human
      # has already approved the `release` environment deployment in
      # `publish` below. Only runs on the publish path — a no-op push has
      # nothing to check, and most pushes to `main` are no-ops.
      - name: Verify CHANGELOG.md has a release-notes section for this version
        if: steps.decide.outputs.decision == 'publish'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_decide.py notes \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --out "${RUNNER_TEMP}/notes-preview.md"

  publish:
    name: Publish to crates.io
    needs: check
    if: needs.check.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write # lets crates-io-auth-action request the OIDC token
      contents: write # lets this job push the release tag and create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The GitHub release's notes are CHANGELOG.md's `## [X.Y.Z]` section.
      # Extracted (and required non-empty) before `cargo publish` runs, so a
      # version bump with no changelog section fails here — before any tag
      # is created and before anything touches crates.io.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 scripts/release_decide.py notes \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --out "${RUNNER_TEMP}/notes.md"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `cargo publish` verifies by building the packaged crate with default
      # features — `quadraui` has none, so no system libraries (gtk4 etc.)
      # are needed on this runner.
      #
      # Tolerates exactly one failure mode: this exact version is already on
      # crates.io. That happens on a re-run after an earlier invocation of
      # this workflow published successfully but then failed before
      # tagging/releasing (e.g. a transient `gh release create` failure) —
      # re-running must finish the tag + release, not fail a second time on
      # a publish that already succeeded. The match is anchored to cargo's
      # actual duplicate-version message (`crate version \`X.Y.Z\` is
      # already uploaded`) with this run's own version interpolated in, not
      # a bare substring like "already exists" — a generic match would also
      # swallow an unrelated failure (e.g. a git/fs error whose text happens
      # to contain "already exists") and go on to tag + release a version
      # that was never actually published. Any other failure still fails
      # the step.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set +e
          output=$(cargo publish -p quadraui --locked 2>&1)
          status=$?
          echo "${output}"
          set -e
          if [ "${status}" -ne 0 ]; then
            if echo "${output}" | grep -qiE "crate version \`${VERSION}\` is already uploaded"; then
              echo "::notice::quadraui ${VERSION} is already published on crates.io; treating this as a partial-failure re-run and continuing to tag + release."
            else
              exit "${status}"
            fi
          fi

      # Idempotent for the same re-run scenario as the publish step above: an
      # earlier run may have already pushed this tag before failing later. A
      # lightweight tag needs no committer identity, so no `git config` step
      # is needed first.
      - name: Create + push release tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists on origin; skipping create+push"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      # After the tag, so `--verify-tag` has something to verify, and after
      # the publish, so a GitHub release only ever exists for a version that
      # is actually on crates.io. Skipped if one was already created by an
      # earlier partial run for this tag.
      #
      # `--verify-tag` can flake immediately after the push above: GitHub's
      # API occasionally hasn't indexed the just-pushed ref yet, which makes
      # `gh release create --verify-tag` fail with "tag not found" on a tag
      # that genuinely exists. A short fixed-delay retry loop absorbs that
      # without masking a real failure (it still exits non-zero after all
      # attempts are exhausted).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving it as is"
          else
            for attempt in 1 2 3 4 5; do
              if gh release create "${TAG}" --verify-tag \
                --title "quadraui ${TAG}" \
                --notes-file "${RUNNER_TEMP}/notes.md"; then
                exit 0
              fi
              echo "gh release create attempt ${attempt} failed; retrying in 10s" >&2
              sleep 10
            done
            exit 1
          fi
