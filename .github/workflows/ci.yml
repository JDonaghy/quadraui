name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  example-coverage:
    # #311: block a PR that adds a new `examples/tui_*.rs` without the
    # matching driver test in `quadraui/tests/tui_example_driver.rs`. #A1
    # declares the rule, `tools/example_coverage.py` (#310) measures it, but
    # nothing enforced it — a PR could add an uncovered example and merge
    # anyway, relying on the adversarial reviewer (a human/model, not a
    # gate) to catch it. This job is that gate.
    #
    # Delta-only, not full-audit: `tools/example_coverage.py` today reports
    # 31/44 TUI examples covered (13 pre-existing gaps from before the
    # #B1-#B5 backfill) and 6/41 GTK. Failing on ANY gap would make this job
    # red on every PR regardless of what it touches. `--fail-on-gap` instead
    # only fails when a `tui_*.rs` file ADDED by this PR (relative to
    # `github.event.pull_request.base.sha`, not the merge-base branch name —
    # see the tool's docstring) lacks coverage; pre-existing gaps still print
    # in the matrix but don't fail the run. GTK examples are excluded from
    # the delta check entirely — GTK-example coverage waits on `GtkDriver`
    # (#301), same "TUI only for now" line CLAUDE.md draws.
    #
    # `pull_request`-only: the delta needs a base commit to diff against,
    # which only exists for a PR event (`push` to main/develop has already
    # merged, there's nothing left to gate).
    name: Example-test coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1: the diff below
          # needs the PR's base commit in this checkout's object graph, and
          # a shallow clone of just the merge ref wouldn't have it.
          fetch-depth: 0
      - name: Example-test coverage
        run: |
          python3 tools/example_coverage.py \
            --fail-on-gap \
            --base "${{ github.event.pull_request.base.sha }}"

  tui:
    name: tui + win (build, test, clippy) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # BOTH legs are blocking (#590, W-7 of #580). The windows-latest leg
    # landed in #581 with `continue-on-error` because the *portable core*
    # (ratatui / arboard / unicode-width / portable-pty→ConPTY) had never been
    # built or tested on a real Windows host, and a red first run would have
    # blocked coord-tui and vimcode — both gated by the `downstream` job below
    # — on something neither of them touched. That was a rollout device with a
    # stated exit condition, not a permanent posture.
    #
    # The condition was met: the Windows *job* concluded `success` on every CI
    # run on develop across #585/#587/#588/#589, covering real changes to
    # tui/mod.rs, tui/backend.rs, shell_adapter.rs and this file. So the guard
    # is gone and a Windows-only failure now blocks the PR — and, because
    # coord's merge gate reads per-check conclusions rather than the workflow
    # run's (claude-coordinator#581), blocks `coord merge` too. That is the
    # intent: while `continue-on-error` was set, a Windows regression merged
    # silently and this column looked like protection while providing none.
    #
    # If a Windows-specific flake ever wedges unrelated work, reverting is
    # this comment plus one line — but prefer fixing the flake, because the
    # non-blocking state is indistinguishable from having no Windows CI.
    strategy:
      # One platform failing must not cancel the other — seeing both columns
      # is the entire reason this is a matrix rather than two hardcoded jobs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # MUST precede actions/checkout. GitHub's Windows image ships
      # `core.autocrlf=true`, which rewrites every LF to CRLF as the working
      # tree is written — that alone is enough to red `cargo fmt --check` and
      # any test asserting on "\n", and nothing downstream can undo it once
      # the files are on disk. `core.longpaths` is the same class of problem:
      # cargo's hashed `target/` directories routinely exceed the legacy
      # 260-char MAX_PATH, and the failure surfaces as an unrelated-looking
      # I/O error deep in a build script.
      - name: Configure git for Windows (line endings + long paths)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --system core.longpaths true
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default". On Windows
      # this resolves the `x86_64-pc-windows-msvc` host triple, which is the
      # one the eventual `win` backend needs anyway — `windows-rs` + Direct2D
      # are MSVC-ABI, not GNU.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (tui feature)
        run: cargo build --features tui --workspace --exclude kubeui-gtk
      - name: Test (tui feature)
        run: cargo test --features tui --workspace --exclude kubeui-gtk
      - name: Clippy (tui feature)
        run: cargo clippy --features tui --workspace --exclude kubeui-gtk -- -D warnings
      # win compile gate (#538). `win`'s Cargo dependency on `windows` is
      # gated to `target.'cfg(target_os = "windows")'`, and every real
      # WinAPI call `src/win/{backend,run}.rs` makes is itself wrapped in
      # `cfg(target_os = "windows")` with a `todo!()` fallback body — #19
      # deliberately kept that shape (rather than target-gating the whole
      # `win` module the way `macos` is gated in `lib.rs`) specifically so
      # this still type-checks on Linux with no new runner. That's what
      # keeps this step free to run here. Its entire purpose is to keep the
      # `Backend` trait's no-default-impl policy (BACKEND_TRAIT_PROPOSAL.md
      # §4, PRIMITIVE_RULES.md rule 7) actually enforced for the win
      # backend: before this step existed, #531 merged `draw_settings_chrome`
      # with no `WinBackend` impl and nothing caught it (7 missing methods
      # accumulated silently, fixed by #540/#537). A *compile* check is
      # per-repo, not per-OS, so this runs once on the ubuntu leg rather
      # than once per matrix leg — running it again on the windows-latest
      # leg would check the exact same source against the exact same
      # toolchain target and prove nothing new. What it can't prove: that
      # the `cfg(target_os = "windows")` arms landed by #19 actually build
      # for real — that's the separate, non-blocking "win feature" step on
      # the windows-latest leg below.
      # Blocking (no continue-on-error): unlike the windows-latest leg above,
      # which starts non-blocking because the *portable core* has never run
      # on real Windows, this only needs to compile — #540 already made it
      # green, so there's no red-on-arrival rollout problem to phase in.
      - name: Compile check (win feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p quadraui --features win
      # The step above only type-checks; nothing under `--features win` was
      # ever *run*. `src/win/msg.rs` exists to close that hole: it holds the
      # one part of the Win32 bootstrap that is pure arithmetic (`WM_SIZE`
      # LOWORD/HIWORD unpacking, `WM_DPICHANGED`'s DPI → `Viewport::scale`
      # ratio), deliberately host-independent so its unit tests execute on
      # this ubuntu runner. Those transposition/units bugs are invisible to
      # `cargo check` on every platform, and the windows-latest steps below
      # only *build*, so without this step they would ship untested. Runs on
      # ubuntu rather than windows-latest for the same reason the compile
      # check does: the code under test has no `cfg(target_os)` in it, so
      # running it twice would prove nothing new.
      - name: Test (win feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p quadraui --features win
      # macOS compile gate, cross-target — the same trick the win compile
      # gate above plays, for the one backend that had no Linux-side gate
      # at all. `lib.rs` cfg's `mod macos` on `target_os = "macos"`, so a
      # plain `cargo check --features macos` on this runner exits 0 having
      # compiled NONE of `src/macos/` (measured in macos.yml's header).
      # `--target aarch64-apple-darwin` fixes exactly that: `cargo check`
      # never links, so it needs the target's `rust-std` and no Apple SDK,
      # and it then compiles every line of `src/macos/` plus — via
      # `--all-targets` — its `#[cfg(test)]` blocks, which is where
      # `-D warnings`' `dead_code` failures surface.
      #
      # Why this step exists, and why it still pulls its weight after #792:
      # before #792, `.github/workflows/macos.yml` was `paths`-filtered to
      # `quadraui/src/macos/**` alone, so a PR that touched *shared* code
      # could make the macOS build unbuildable with no macOS gate running
      # at all — the break then landed on an unrelated author at the merge
      # gate, whichever PR next happened to touch `src/macos/`. That is
      # precisely what happened between #741 (added `mod text_selection`,
      # consumed by tui/gtk/win but not macos, so dead code under
      # `--features macos` alone → hard error under `-D warnings`) and
      # #780, which paid for it. #792 widened macos.yml's `paths` filter to
      # `quadraui/src/**`, so that specific gap — a shared-code PR getting
      # *no* macOS signal — is closed at the source now. This step stays
      # anyway, blocking on the same ubuntu leg as every other feature-gate
      # check here rather than only on a separate `macos-latest` job: it's
      # ~20s and needs no macos-latest minutes, so it gives the fastest
      # possible compile-truth signal on a PR that touches `src/macos/`
      # directly, before the slower `macos-latest` job (which now also
      # installs GTK4 via Homebrew for the cross-backend-parity leg, see
      # macos.yml) even starts.
      #
      # What it still cannot do is *run* anything — macos.yml's
      # `macos-latest` job remains the only place `src/macos`'s tests
      # execute, so an AppKit call inside a `#[test]` stays invisible here
      # (see BACKEND.md §7). This gate is compile-truth only, deliberately.
      - name: Compile check (macos feature, cross-target)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-apple-darwin
          cargo check -p quadraui --features macos \
            --target aarch64-apple-darwin --all-targets
      # Real Windows build for #19's Win32 + Direct2D bootstrap. Unlike the
      # step above (a same-source-any-OS type-check), this actually
      # exercises the `cfg(target_os = "windows")` arms in
      # `src/win/{backend,run}.rs` against the real `windows` crate on the
      # `windows-latest` runner's `x86_64-pc-windows-msvc` toolchain — the
      # only place that can happen, since `ubuntu-latest` never has
      # `target_os = "windows"` regardless of which `--target` you pass.
      # Blocking (no continue-on-error): #674 is the flip. These two steps
      # (and `Test (win feature, real Windows)` below) started with
      # `continue-on-error: true` in #581/#589 as a phased-rollout device —
      # the first PR to land real Win32/Direct2D calls had no prior green
      # `develop` run to trust, and a red first run would have blocked
      # coord-tui and vimcode (both gated by the `downstream` job below) on
      # something neither of them touched.
      #
      # The condition was met: checked via the Actions API against
      # `JDonaghy/quadraui`'s `ci.yml` runs on `develop`, every run from #24
      # (`04213ae`, the commit that gave `Test (win feature, real Windows)`
      # something real to exercise) through the tip at flip time
      # (`dfe0223f`) — 30 runs, 2026-08-30 through 2026-09-02, including #23
      # (`ede7a75`, `win_platform_services`'s 8 service tests) — concluded
      # `success` on `Build (win feature)`, `Clippy (win feature)`, and
      # `Test (win feature, real Windows)` with zero failures. `HeadlessSurface`
      # needs no `HWND`, GPU, or desktop session (`ID2D1DCRenderTarget` +
      # `CreateDIBSection` on WARP), so there is no display-server reason for
      # this leg to be flaky — same read as the `tui`-feature windows-latest
      # leg's own flip above. If a Windows-specific flake ever wedges
      # unrelated work, reverting is these three `continue-on-error: true`
      # lines back — but prefer fixing the flake, same rationale as that leg.
      #
      # #23 added `win_platform_services` alongside `win_demo` — same
      # bootstrap posture (draws nothing, `cfg`-split `main()`), now
      # exercising `WinPlatformServices` instead of just the window/
      # render-target lifecycle. #31 added every remaining paired example
      # (`win_app`, `win_multi_tree`, `win_split`, `win_panel`,
      # `win_toast`, `win_indicators`, `win_search_panel`,
      # `win_sidebar_search`, `win_menu_bar`, `win_data_table`,
      # `win_chart`, `win_form_groups`, `win_hscroll`) now that #25–#30
      # landed the rasterisers each one needs. Built in the same two
      # steps rather than new ones so a future example added here only
      # needs a name added to these `--example` lists, not a new step
      # pair. #745 added `win_appshell_demo` — the only `ShellApp` /
      # `run_with_shell()` example for `win` (#707), and until this fix
      # the one example that proves the shell path compiles was absent
      # from this leg entirely.
      - name: Build (win feature)
        if: matrix.os == 'windows-latest'
        run: cargo build -p quadraui --example win_demo --example win_platform_services --example win_app --example win_multi_tree --example win_split --example win_panel --example win_toast --example win_indicators --example win_search_panel --example win_sidebar_search --example win_menu_bar --example win_data_table --example win_chart --example win_form_groups --example win_hscroll --example win_appshell_demo --features win
      - name: Clippy (win feature)
        if: matrix.os == 'windows-latest'
        run: cargo clippy -p quadraui --example win_demo --example win_platform_services --example win_app --example win_multi_tree --example win_split --example win_panel --example win_toast --example win_indicators --example win_search_panel --example win_sidebar_search --example win_menu_bar --example win_data_table --example win_chart --example win_form_groups --example win_hscroll --example win_appshell_demo --features win -- -D warnings
      # Headless Direct2D test surface (#24, `src/win/testing.rs`'s
      # `HeadlessSurface`: an `ID2D1DCRenderTarget` bound to an in-memory
      # DIB section — no `HWND`, display, or GPU). The two steps above
      # only *build* `win_demo`; this is the step that actually `cargo
      # test`s under `--features win` against a real Windows host, since
      # every prior `cfg(target_os = "windows")` arm needed either a
      # live `HWND` (#19's render-target bootstrap) or a real font
      # collection (#21's DirectWrite metrics) — neither headless.
      # Blocking (no continue-on-error): see the flip rationale and evidence
      # in the comment above `Build (win feature)`.
      - name: Test (win feature, real Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test -p quadraui --features win
      # C0 + Tier-1 `win` burn-down tables, actually surfaced (quadraui#722
      # review). The step above already runs this same `conformance.rs`
      # binary under `--features win` — `c0_paint_smoke` registers a `win`
      # column (Tier-0, this issue) and `backends()` already registered one
      # for `conformance_matrix` (Tier-1, #708) — but both are designed to
      # *pass* here (their `win` column is `Gating::BurnDown`, so its
      # PANIC/FAIL rows never reach `blocking_gaps`), and `cargo test`
      # captures and discards stdout for a passing test. Without a
      # dedicated `--nocapture` run neither table was ever visible on a
      # routine green CI run — only if someone reran locally or the test
      # started failing. `--test conformance` scopes this to the one
      # binary that matters; every other `--features win` test already ran
      # in the step above, so nothing here re-runs work.
      - name: Conformance matrix (win)
        if: matrix.os == 'windows-latest'
        run: cargo test -p quadraui --features win --test conformance -- --nocapture
      # `c0_paint_smoke`'s table (quadraui#722) — its own file
      # (`conformance-matrix-c0.txt`, written by `write_artifact` in
      # `tests/conformance.rs`) so it can't race with `conformance_matrix`'s
      # write to `conformance-matrix.txt` in the same test binary.
      - name: Upload conformance matrix (win, C0)
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-c0-win
          path: target/conformance-matrix-c0.txt
          if-no-files-found: warn
      # `conformance_matrix`'s Tier-1 table for this same run — distinct
      # artifact name from `conformance-matrix-tui-windows-latest` above
      # (that one is the `tui`/`tui-vt100` backends only; this is `win`
      # alone) and uploaded here, before anything else in this job could
      # overwrite `target/conformance-matrix.txt` again.
      - name: Upload conformance matrix (win, Tier-1)
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-win
          path: target/conformance-matrix.txt
          if-no-files-found: warn
      # Tier-3 pty smoke (quadraui#302, tests/tui_pty_smoke.rs): spawns real
      # `cargo run --example` processes in a real PTY (portable-pty) and
      # drives them with real ANSI escape sequences (vt100). No display
      # server needed — a pty is just a kernel device — so unlike the GTK
      # live-app smoke (GD-5, #450) this is a real CI gate, not an
      # operator-run tier. Scoped to `-p quadraui` since the harness only
      # exists there; `terminal` pulls in portable-pty/vt100 (already
      # workspace deps behind that feature, see quadraui/Cargo.toml).
      - name: Test (pty smoke, tui + terminal features)
        run: cargo test -p quadraui --features tui,terminal --test tui_pty_smoke
      - name: Clippy (pty smoke, tui + terminal features)
        run: cargo clippy -p quadraui --features tui,terminal --test tui_pty_smoke -- -D warnings
      # Terminal-feature coverage that the steps above don't reach (#483).
      # `tui_terminal` declares `required-features = ["tui", "terminal"]` in
      # Cargo.toml (see `[[example]]` block), so the plain
      # `cargo build --features tui` step near the top of this job silently
      # skips it — and the pty-smoke step above only spawns `tui_pipeline` /
      # `tui_chat` (`cargo run --features tui`, no `terminal`), so
      # `tui_terminal` itself has never actually been *compiled* by CI
      # despite #397/#437/#439/#452 landing fixes there. `-p quadraui`
      # rather than `--workspace`: examples aren't workspace-wide.
      - name: Build (tui_terminal example, tui + terminal features)
        run: cargo build -p quadraui --example tui_terminal --features tui,terminal
      # `terminal_engine.rs` (the PTY + vt100 + scrollback engine) is gated
      # on `feature = "terminal"` alone (lib.rs), so its 54 `#[cfg(test)]`
      # unit tests are never compiled by the plain `--features tui` test
      # step above, and the pty-smoke step's `--test tui_pty_smoke` scopes
      # cargo to that one integration-test binary only — the lib's own unit
      # tests still don't run. Bare `--features terminal` (no tui/gtk) can't
      # fix this either: `ShellContext::new` (`src/shell.rs`) is
      # `#[cfg(any(feature = "tui", feature = "gtk"))]` per #540, so
      # `shell.rs`'s test module fails to compile under `terminal` alone.
      # `tui,terminal` (already paid for by the pty-smoke step above, so
      # this is incremental) plus a `--lib terminal_engine` filter keeps
      # this scoped to the tests this step exists for, instead of
      # re-running the ~1700 other `--lib` tests the plain `tui` step above
      # already covers.
      - name: Test (terminal_engine unit tests, tui + terminal features)
        run: cargo test -p quadraui --features tui,terminal --lib terminal_engine
      # Conformance matrix (quadraui#491, epic #480). The suite runs as part
      # of `cargo test --features tui` above; this step re-runs just that
      # target with --nocapture so the scenario x backend table lands in the
      # log, and uploads it as an artifact. For a backend that doesn't exist
      # yet (Windows, macOS) that artifact IS the implementation checklist,
      # so it must survive the run even when everything passed.
      #
      # Under the OS matrix this now produces two artifacts of the same
      # *scenario* corpus run on two different hosts. That is not redundant:
      # `TuiBackend` renders to ratatui's TestBackend, but the scenarios
      # exercise the portable core underneath it (layout, text measurement,
      # unicode width, event translation), and that core is exactly where a
      # Windows-only divergence would hide.
      #
      # `tui,terminal` (not just `tui`) so the `"tui-vt100"` observer column
      # (quadraui#555, `quadraui::tui::vt_testing::TuiVtDriver`) actually
      # runs here rather than only under a worker's manually-added feature —
      # `terminal` is already paid for by the pty-smoke/terminal_engine
      # steps above in this same job, so this is incremental, same as those.
      - name: Conformance matrix (tui)
        run: cargo test -p quadraui --features tui,terminal --test conformance -- --nocapture
      - name: Upload conformance matrix (tui)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Suffixed per matrix leg because upload-artifact@v4 ERRORS on a
          # duplicate artifact name instead of merging into it (a deliberate
          # v3→v4 behaviour change). A bare "conformance-matrix-tui" here
          # would fail whichever leg finished second — and, because that
          # failure lands in the *upload* step rather than the test step, it
          # would read as a CI plumbing flake rather than the naming bug it
          # is. The ubuntu leg's artifact is renamed too; keeping the old
          # name on one leg and suffixing the other is worse than either.
          name: conformance-matrix-tui-${{ matrix.os }}
          path: target/conformance-matrix.txt
          if-no-files-found: warn

  gtk:
    name: gtk (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GTK4 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev
      - uses: Swatinem/rust-cache@v2
      # `gtk,tui` (not just `gtk`) so the cross-backend parity suite
      # (quadraui/tests/cross_backend_parity.rs, #448) — which needs both
      # `TuiDriver` and `GtkDriver` compiled in to compare them — actually
      # runs in CI. Both drivers are display-free, so this stays headless;
      # no Xvfb, no capability gate (quadraui#446/#447/#448, GD-1..GD-3).
      - name: Build (gtk + tui features)
        run: cargo build --features gtk,tui --workspace --exclude kubeui
      # --no-fail-fast: without it, a failure in the `quadraui` lib unit-test
      # target (e.g. pre-existing gtk::services main-thread panics) makes
      # cargo abort before ever building/running the tests/*.rs integration
      # targets — silently hiding the GD-3 smoke/parity suite's pass/fail
      # status. With --no-fail-fast, cargo still runs (and reports) every
      # target, and the step still fails overall if anything failed.
      - name: Test (gtk + tui features)
        run: cargo test --features gtk,tui --workspace --exclude kubeui --no-fail-fast
      - name: Clippy (gtk + tui features)
        run: cargo clippy --features gtk,tui --workspace --exclude kubeui -- -D warnings
      # `gtk_terminal` declares `required-features = ["gtk", "terminal"]`
      # in Cargo.toml, so the plain `--features gtk,tui` build/test/clippy
      # steps above (no `terminal`) silently skip it — the same gap
      # `tui_terminal` had in the `tui` job, fixed there for the same
      # reason (#483). `-p quadraui` rather than `--workspace`: examples
      # aren't workspace-wide.
      - name: Build (gtk_terminal example, gtk + terminal features)
        run: cargo build -p quadraui --example gtk_terminal --features gtk,terminal
      # Both backends registered at once, so the artifact from this job is
      # the full cross-backend matrix rather than a single column.
      - name: Conformance matrix (gtk + tui)
        run: cargo test -p quadraui --features gtk,tui --test conformance -- --nocapture
      - name: Upload conformance matrix (gtk + tui)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-gtk-tui
          path: target/conformance-matrix.txt
          if-no-files-found: warn

  downstream:
    # Compile truth for the two external consumers (#528). quadraui is
    # `publish = false`, nothing pins a published version, and vimcode's own
    # CI clones this repo's `develop` tip by relative path — so quadraui
    # being green here has historically proven nothing about the consumers
    # (#476 broke both on 2026-08-05, silently, until their next CI run).
    # This job clones both consumers as siblings of this checkout so
    # vimcode's `path = "../quadraui/quadraui"` dep resolves straight onto
    # the PR's quadraui. coord-tui no longer has a path dep at all — since
    # claude-coordinator#1973 it pins `quadraui` to a fixed git rev — so for
    # coord-tui specifically, the steps below also drop a `.cargo/config.toml`
    # `paths` override into its checkout to redirect that pinned dep onto
    # the sibling checkout too — and, because cargo discovers that config by
    # walking up from the *process CWD* and not from `--manifest-path`, every
    # cargo step below sets `working-directory:` into the consumer rather
    # than passing `--manifest-path` from the workspace root. Getting that
    # wrong makes the override a no-op and the coord-tui leg silently inert;
    # a `cargo metadata` assertion below fails the job loudly if it ever
    # regresses. Both consumers are then `cargo check --all-targets`ed.
    #
    # coord-tui lives in `JDonaghy/coord-tui` since claude-coordinator#2899
    # (2026-08-29) split it out of the coordinator repo — repo root = crate
    # root now, and the coordinator repo itself was renamed to
    # `code-coordinator`. That repo is not anonymously readable, so the
    # coord-tui leg only runs when a `COORD_TUI_TOKEN` secret is available;
    # see the clone step for the full rationale. The vimcode leg is
    # unconditional.
    name: downstream consumers (compile truth)
    runs-on: ubuntu-latest
    env:
      # The workflow-level `RUSTFLAGS: "-D warnings"` above applies to every
      # job unless overridden. A `#[deprecated]` shim — the entire point of
      # PRIMITIVE_RULES.md rule 8's deprecate-then-remove protocol — emits a
      # *warning* in consumer code that references the deprecated item.
      # Under `-D warnings` that warning becomes a hard compile error, so
      # this gate would go red on exactly the changes authored correctly per
      # rule 8, and stay green only for the reckless ones that skip it.
      # Do NOT "tidy" this back to inheriting the workflow default.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default". Consumer
      # checkouts below have no such pin, so they build with whatever this
      # step resolves as "stable" — that's intentional, it's their toolchain
      # choice to make, not ours to impose via this gate.
      - uses: dtolnay/rust-toolchain@stable

      # vimcode's manifest declares `default = ["gui"]`, and `gui` pulls
      # `gtk4`/`pangocairo` plus `quadraui/gtk` — so a *default-features*
      # vimcode check needs the same GTK4 dev headers the `gtk` job above
      # installs, or its gtk4 build script dies at pkg-config time. That
      # failure would hit the PR leg and the control leg identically, so the
      # "pre-existing breakage" branch below would swallow it and the vimcode
      # leg would be permanently inert — the same silent-green failure mode
      # #528 exists to prevent. Installing the headers instead of dropping to
      # `--no-default-features` also means quadraui's GTK backend surface
      # gets consumer compile-truth, which is the point of epic #479.
      - name: Install GTK4 system libraries (vimcode's default features need them)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev

      # coord-tui no longer lives in the coordinator repo. claude-coordinator
      # #2899 (2026-08-29, phase 4 of its #2894) deleted `tui/` and moved the
      # crate to a standalone `JDonaghy/coord-tui` whose *repo root is the
      # crate root* — and the coordinator repo itself was renamed
      # `claude-coordinator` → `code-coordinator`. The old
      # `$P/claude-coordinator/tui` shape below therefore resolved to a
      # directory holding nothing but `tests/acceptance/`, the override
      # template's existence guard fired, and this job went red on every
      # quadraui PR regardless of its contents (caught on #19).
      #
      # `coord-tui` is not anonymously readable today (an unauthenticated
      # clone 404s), and quadraui's `GITHUB_TOKEN` is scoped to this repo
      # only, so the coord-tui leg *cannot* run without a cross-repo
      # credential. `COORD_TUI_TOKEN` (a read-only PAT / fine-grained token
      # with contents:read on coord-tui) re-arms it the moment one exists;
      # until then the leg is skipped with a loud warning rather than
      # failing, because holding every quadraui PR hostage to a consumer
      # repo quadraui cannot even read is strictly worse than shipping with
      # the vimcode leg alone. This is the one place in this job where
      # "skipped" is acceptable — do not extend that posture to the checks
      # themselves, and delete this branch as soon as the token/visibility
      # lands.
      #
      # `GIT_TERMINAL_PROMPT=0` matters: without it a private/absent repo
      # makes git block on a username prompt and the step hangs until the
      # job timeout instead of failing in a second.
      - name: Clone consumers as siblings of this checkout
        id: clone
        env:
          COORD_TUI_TOKEN: ${{ secrets.COORD_TUI_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          P="$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/vimcode "$P/vimcode"

          if [ -n "${COORD_TUI_TOKEN:-}" ]; then
            URL="https://x-access-token:${COORD_TUI_TOKEN}@github.com/JDonaghy/coord-tui"
          else
            URL="https://github.com/JDonaghy/coord-tui"
          fi
          if git clone --depth 1 "$URL" "$P/coord-tui"; then
            echo "coord_tui=true" >> "$GITHUB_OUTPUT"
            # Tolerate both layouts: the post-#2899 repo root, and a
            # `tui/` subdirectory in case the crate is ever re-nested.
            if [ -f "$P/coord-tui/Cargo.toml" ]; then
              D="$P/coord-tui"
            elif [ -f "$P/coord-tui/tui/Cargo.toml" ]; then
              D="$P/coord-tui/tui"
            else
              echo "::error::Cloned JDonaghy/coord-tui but found no Cargo.toml at its root or under tui/. The crate moved again — repoint this step rather than deleting it, or this gate silently stops covering coord-tui."
              exit 1
            fi
            echo "COORD_TUI_DIR=$D" >> "$GITHUB_ENV"
          else
            echo "coord_tui=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not clone JDonaghy/coord-tui (private or absent, and no COORD_TUI_TOKEN secret is set on this repo). The coord-tui half of the downstream compile-truth gate did NOT run — only vimcode did. Add a read-only COORD_TUI_TOKEN secret, or make the repo public, to re-arm it."
          fi

      # coord-tui's Cargo.toml stopped being a path dependency in
      # claude-coordinator#1973 (2026-08-10): it pins
      # `quadraui = { git = "...", rev = "<fixed sha>" }`. A git+rev source
      # is resolved from GitHub, completely independent of the sibling
      # checkout above — so without this step, `cargo check` on coord-tui
      # would silently build against that fixed rev forever, never against
      # this PR's quadraui, and this whole leg of the gate would be inert.
      # The fix is the `paths` override coord-tui documents for local
      # co-development (`cargo-config-local-quadraui.toml.example`), which
      # redirects the `quadraui` package — matched by name+version, not by
      # source — onto a local checkout regardless of what Cargo.toml pins.
      #
      # We write the override ourselves with an ABSOLUTE path instead of
      # copying that template verbatim, which is what the pre-#2899 version
      # of this step did. The template's `paths = ["../../quadraui/quadraui"]`
      # is resolved relative to the directory holding the `.cargo` dir, so it
      # encodes *coord-tui's own* checkout layout — and that layout just
      # changed underneath us (one directory level shallower now that the
      # repo root is the crate root), which would have silently pointed the
      # override at a nonexistent path. An absolute path derived from
      # $GITHUB_WORKSPACE cannot drift with their layout, and the property
      # that actually matters is still asserted, not assumed: the
      # `cargo metadata` step below hard-fails unless cargo really resolved
      # `quadraui` to this PR's checkout. Assert the outcome, not the proxy.
      # (Template absence is now a warning for the same reason — it is
      # evidence about *their* dev docs, not about whether this gate works.)
      #
      # Note for future dependency changes: a `paths` override that adds a
      # dependency the overridden package didn't have — exactly what #19 did
      # by adding the optional, Windows-gated `windows` crate — makes cargo
      # print "path override for crate `quadraui` has altered the original
      # list of dependencies". Verified on cargo 1.97.1: it is a *warning*,
      # not an error, and `RUSTFLAGS` has no bearing on it since it comes
      # from cargo rather than rustc. Cargo's docs say it will eventually
      # become a hard error; when that day comes, switch this to a
      # `[patch."https://github.com/JDonaghy/quadraui"]` block (cargo's own
      # recommended replacement) rather than dropping the coord-tui leg.
      - name: Point coord-tui at this PR's quadraui, not its pinned git rev
        if: steps.clone.outputs.coord_tui == 'true'
        run: |
          set -euo pipefail
          D="$COORD_TUI_DIR"
          Q="$(cd "$GITHUB_WORKSPACE/quadraui" && pwd -P)"
          if [ ! -f "$D/cargo-config-local-quadraui.toml.example" ]; then
            echo "::warning::coord-tui no longer ships cargo-config-local-quadraui.toml.example. Writing the paths override anyway; the cargo metadata assertion below is what proves it took effect."
          fi
          mkdir -p "$D/.cargo"
          printf 'paths = ["%s"]\n' "$Q" > "$D/.cargo/config.toml"

      # Placed after the consumer clone (and the coord-tui .cargo override
      # above) so the action's Cargo.lock hashing can actually see the
      # consumer manifests it's told to cache below — caching this job at
      # its default $GITHUB_WORKSPACE-only scope would miss both consumer
      # builds entirely, since every real `cargo check` in this job targets
      # a sibling directory outside the checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          # `../coord-tui` (not `../claude-coordinator/tui`) since
          # claude-coordinator#2899 moved the crate to its own repo whose
          # root is the crate root. A stale entry here is only a cache miss,
          # never a wrong result — but it silently costs a full cold consumer
          # build every run, so keep it pointed at the real crate.
          workspaces: |
            ../coord-tui -> target
            ../vimcode -> target

      # cargo check, not build/test: the question this job answers is
      # "does this compile against the consumer's tree", not "is the
      # consumer correct" — each consumer runs its own tests in its own CI.
      #
      # `--all-targets` is not optional here. A bare `cargo check` compiles
      # only lib/bin targets, and quadraui's single most-consumed public
      # surface — `quadraui::tui::testing::{TuiDriver, driver_with_shell}`,
      # 242 call sites in coord-tui — is referenced *exclusively* from
      # coord-tui's test targets. Measured: renaming `driver_with_shell` in
      # this repo leaves a bare `cargo check` on coord-tui at exit 0 (green,
      # gate blind) and takes `--all-targets` to exit 101 with the expected
      # E0432. Dropping the flag re-opens a consumer-hit-shaped hole.
      #
      # Features: coord-tui's dep line already pins
      # `features = ["tui","terminal"]` in its own Cargo.toml, so this
      # inherits that. vimcode is checked with its *default* features, which
      # is `["gui"]` — hence the GTK4 apt step above; that also gets
      # quadraui's GTK backend covered, not just the TUI one.
      #
      # ── `working-directory:` is load-bearing on every cargo step below ──
      # Cargo discovers `.cargo/config.toml` by walking up from the invoking
      # process's *current directory*, NOT from `--manifest-path`'s directory.
      # So `cargo check --manifest-path .../tui/Cargo.toml` run from
      # $GITHUB_WORKSPACE (the default CWD) never sees the `paths` override
      # written above, and quietly resolves `quadraui` from the pinned git
      # rev instead — the whole coord-tui leg silently decoupled from the PR.
      # Verified with cargo 1.97.1 on this exact shape (git+rev dep, a
      # same-name+version local copy, a `paths` override next to the
      # manifest): invoked via `--manifest-path` from an unrelated CWD it
      # linked the *git* source; invoked with CWD inside the manifest's
      # directory it linked the *local override*. Do not "simplify" these
      # back to a bare `--manifest-path` from the workspace root.
      # vimcode has no `.cargo/config.toml` today (its build.rs resolves the
      # sibling quadraui from CARGO_MANIFEST_DIR, so it is CWD-independent),
      # but its steps below cd in too, so adding one upstream can't silently
      # re-open this same hole.
      #
      # `working-directory: ${{ env.COORD_TUI_DIR }}` rather than a literal
      # path: the clone step above resolves the crate directory (repo root
      # post-#2899, `tui/` if it is ever re-nested) and exports it. `env` is
      # available to `working-directory`, but NOT to `if:` — which is why the
      # skip conditions below read `steps.clone.outputs.coord_tui` instead.
      - name: Assert coord-tui actually resolves quadraui to this PR's checkout
        if: steps.clone.outputs.coord_tui == 'true'
        working-directory: ${{ env.COORD_TUI_DIR }}
        run: |
          set -euo pipefail
          want="$(cd "$GITHUB_WORKSPACE/quadraui" && pwd -P)/Cargo.toml"
          got="$(cargo metadata --format-version 1 \
                 | jq -r '.packages[] | select(.name=="quadraui") | .manifest_path')"
          echo "quadraui resolved to: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::coord-tui resolved quadraui to '$got', expected this PR's checkout at '$want'. The .cargo/config.toml paths override did not take effect, so this gate would build coord-tui against its pinned git rev and prove nothing about this PR. Failing loudly rather than passing silently."
            exit 1
          fi

      - name: cargo check — coord-tui (this PR's quadraui)
        id: pr_coord_tui
        if: steps.clone.outputs.coord_tui == 'true'
        continue-on-error: true
        working-directory: ${{ env.COORD_TUI_DIR }}
        run: cargo check --all-targets

      # vimcode's build.rs (vimcode#638) panics before compiling any real
      # source if the sibling quadraui checkout's HEAD doesn't exactly match
      # the SHA pinned in `quadraui-pin.txt` — which the tip clone above
      # never will, since this job floats both the PR's and develop's
      # quadraui rather than the one specific SHA vimcode happens to have
      # pinned. Left unset, that panic fires unconditionally on every run
      # (PR side and control side alike), so pr_vimcode and control_vimcode
      # would always fail identically and the "pre-existing breakage"
      # classification below would swallow every real signal. vimcode ships
      # an escape hatch for exactly this — building against a deliberately
      # different quadraui rev — documented in `quadraui-pin.txt`:
      # VIMCODE_QUADRAUI_UNPINNED=1 downgrades the mismatch to a warning and
      # lets the build proceed to actually compile against the checked-out
      # quadraui. Never set this for a normal vimcode dev build; it is
      # correct here because floating both sides of the comparison against
      # the pin is the entire point of this job.
      - name: cargo check — vimcode (this PR's quadraui)
        id: pr_vimcode
        continue-on-error: true
        working-directory: ../vimcode
        env:
          VIMCODE_QUADRAUI_UNPINNED: "1"
        run: cargo check --all-targets

      # A consumer can be red for reasons that have nothing to do with this
      # PR: its own bug, or mid-migration during PR 2 of a rule-8
      # deprecation. Don't hold quadraui hostage to that. Only run this
      # control when at least one PR-quadraui check above failed. This clone
      # step always clones *both* consumers when it runs at all (cheap: one
      # shallow clone each) — the actual per-consumer scoping happens on the
      # `cargo check — control` steps below via their own `if:`, which only
      # build the consumer(s) whose PR-side check actually failed. This is
      # still the expensive path and most PRs never touch it.
      # The coord-tui clone here is unconditional-on-this-step for the same
      # reason as the PR side: if the PR-side coord-tui check was skipped
      # (repo unreadable), `pr_coord_tui.outcome` is 'skipped', never
      # 'failure', so none of the coord-tui control steps below run at all.
      - name: Clone develop's tip quadraui + consumers as control
        if: steps.pr_coord_tui.outcome == 'failure' || steps.pr_vimcode.outcome == 'failure'
        env:
          COORD_TUI_TOKEN: ${{ secrets.COORD_TUI_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          C="$RUNNER_TEMP/control"
          mkdir -p "$C"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/quadraui "$C/quadraui"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/vimcode "$C/vimcode"
          if [ "${{ steps.pr_coord_tui.outcome }}" = "failure" ]; then
            if [ -n "${COORD_TUI_TOKEN:-}" ]; then
              URL="https://x-access-token:${COORD_TUI_TOKEN}@github.com/JDonaghy/coord-tui"
            else
              URL="https://github.com/JDonaghy/coord-tui"
            fi
            git clone --depth 1 "$URL" "$C/coord-tui"
            if [ -f "$C/coord-tui/Cargo.toml" ]; then
              echo "COORD_TUI_CONTROL_DIR=$C/coord-tui" >> "$GITHUB_ENV"
            else
              echo "COORD_TUI_CONTROL_DIR=$C/coord-tui/tui" >> "$GITHUB_ENV"
            fi
          fi

      # Same git+rev-vs-path-override problem as the PR-side check above,
      # applied to the control clone — and written the same way, as an
      # absolute `paths` override rather than a copy of coord-tui's
      # layout-relative template. The control tree mirrors the sibling
      # layout ($RUNNER_TEMP/control/{quadraui,coord-tui,vimcode}), so the
      # override points at the develop-tip quadraui cloned alongside it.
      - name: Point coord-tui (control) at develop's tip quadraui
        if: steps.pr_coord_tui.outcome == 'failure'
        run: |
          set -euo pipefail
          D="$COORD_TUI_CONTROL_DIR"
          Q="$(cd "$RUNNER_TEMP/control/quadraui/quadraui" && pwd -P)"
          mkdir -p "$D/.cargo"
          printf 'paths = ["%s"]\n' "$Q" > "$D/.cargo/config.toml"

      # Control-side twin of the PR-side assertion. Without it, a control run
      # that silently fell back to the pinned git rev would look "green" and
      # be read as proof the PR broke coord-tui — the opposite error, and
      # just as misleading.
      - name: Assert coord-tui (control) resolves quadraui to develop's tip
        if: steps.pr_coord_tui.outcome == 'failure'
        working-directory: ${{ env.COORD_TUI_CONTROL_DIR }}
        run: |
          set -euo pipefail
          want="$(cd "$RUNNER_TEMP/control/quadraui/quadraui" && pwd -P)/Cargo.toml"
          got="$(cargo metadata --format-version 1 \
                 | jq -r '.packages[] | select(.name=="quadraui") | .manifest_path')"
          echo "quadraui resolved to: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::coord-tui (control) resolved quadraui to '$got', expected develop's tip at '$want'. The .cargo/config.toml paths override did not take effect, so the control leg is not a valid comparison against the PR leg."
            exit 1
          fi

      # `working-directory:` here for the same load-bearing reason as the
      # PR-side check — see the comment on that step.
      - name: cargo check — coord-tui (control, develop's tip quadraui)
        if: steps.pr_coord_tui.outcome == 'failure'
        id: control_coord_tui
        continue-on-error: true
        working-directory: ${{ env.COORD_TUI_CONTROL_DIR }}
        run: cargo check --all-targets

      - name: cargo check — vimcode (control, develop's tip quadraui)
        if: steps.pr_vimcode.outcome == 'failure'
        id: control_vimcode
        continue-on-error: true
        working-directory: ${{ runner.temp }}/control/vimcode
        env:
          VIMCODE_QUADRAUI_UNPINNED: "1"
        run: cargo check --all-targets

      # This PR broke a consumer only if the PR check failed AND the control
      # (same consumer, develop's tip quadraui) succeeded. PR-red +
      # control-red means the consumer was already broken independently of
      # this PR — report it loudly, but pass, so quadraui isn't held hostage
      # to a consumer bug this PR didn't cause and can't fix.
      - name: Evaluate — did this PR break a consumer, or was it already broken?
        if: always()
        run: |
          fail=0
          # 'skipped' (never 'failure') is what a coord-tui leg that could
          # not be cloned reports. Say so out loud in the job summary rather
          # than letting a one-consumer run read as full coverage.
          if [ "${{ steps.clone.outputs.coord_tui }}" != "true" ]; then
            echo "::warning::COVERAGE GAP: only vimcode was checked. coord-tui (JDonaghy/coord-tui) could not be cloned by this job — see the clone step's warning."
          fi
          if [ "${{ steps.pr_coord_tui.outcome }}" = "failure" ]; then
            if [ "${{ steps.control_coord_tui.outcome }}" = "failure" ]; then
              echo "::warning::coord-tui also fails to compile against develop's tip quadraui — pre-existing consumer breakage, not caused by this PR. Not failing this gate."
            else
              echo "::error::coord-tui fails to compile against this PR's quadraui but builds fine against develop's tip. This PR broke coord-tui."
              fail=1
            fi
          fi
          if [ "${{ steps.pr_vimcode.outcome }}" = "failure" ]; then
            if [ "${{ steps.control_vimcode.outcome }}" = "failure" ]; then
              echo "::warning::vimcode also fails to compile against develop's tip quadraui — pre-existing consumer breakage, not caused by this PR. Not failing this gate."
            else
              echo "::error::vimcode fails to compile against this PR's quadraui but builds fine against develop's tip. This PR broke vimcode."
              fail=1
            fi
          fi
          exit "$fail"
