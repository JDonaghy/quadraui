name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  tui:
    name: tui (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (tui feature)
        run: cargo build --features tui --workspace --exclude kubeui-gtk
      - name: Test (tui feature)
        run: cargo test --features tui --workspace --exclude kubeui-gtk
      - name: Clippy (tui feature)
        run: cargo clippy --features tui --workspace --exclude kubeui-gtk -- -D warnings
      # Tier-3 pty smoke (quadraui#302, tests/tui_pty_smoke.rs): spawns real
      # `cargo run --example` processes in a real PTY (portable-pty) and
      # drives them with real ANSI escape sequences (vt100). No display
      # server needed — a pty is just a kernel device — so unlike the GTK
      # live-app smoke (GD-5, #450) this is a real CI gate, not an
      # operator-run tier. Scoped to `-p quadraui` since the harness only
      # exists there; `terminal` pulls in portable-pty/vt100 (already
      # workspace deps behind that feature, see quadraui/Cargo.toml).
      - name: Test (pty smoke, tui + terminal features)
        run: cargo test -p quadraui --features tui,terminal --test tui_pty_smoke
      - name: Clippy (pty smoke, tui + terminal features)
        run: cargo clippy -p quadraui --features tui,terminal --test tui_pty_smoke -- -D warnings
      # Conformance matrix (quadraui#491, epic #480). The suite runs as part
      # of `cargo test --features tui` above; this step re-runs just that
      # target with --nocapture so the scenario x backend table lands in the
      # log, and uploads it as an artifact. For a backend that doesn't exist
      # yet (Windows, macOS) that artifact IS the implementation checklist,
      # so it must survive the run even when everything passed.
      - name: Conformance matrix (tui)
        run: cargo test -p quadraui --features tui --test conformance -- --nocapture
      - name: Upload conformance matrix (tui)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-tui
          path: target/conformance-matrix.txt
          if-no-files-found: warn

  gtk:
    name: gtk (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default".
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GTK4 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev
      - uses: Swatinem/rust-cache@v2
      # `gtk,tui` (not just `gtk`) so the cross-backend parity suite
      # (quadraui/tests/cross_backend_parity.rs, #448) — which needs both
      # `TuiDriver` and `GtkDriver` compiled in to compare them — actually
      # runs in CI. Both drivers are display-free, so this stays headless;
      # no Xvfb, no capability gate (quadraui#446/#447/#448, GD-1..GD-3).
      - name: Build (gtk + tui features)
        run: cargo build --features gtk,tui --workspace --exclude kubeui
      # --no-fail-fast: without it, a failure in the `quadraui` lib unit-test
      # target (e.g. pre-existing gtk::services main-thread panics) makes
      # cargo abort before ever building/running the tests/*.rs integration
      # targets — silently hiding the GD-3 smoke/parity suite's pass/fail
      # status. With --no-fail-fast, cargo still runs (and reports) every
      # target, and the step still fails overall if anything failed.
      - name: Test (gtk + tui features)
        run: cargo test --features gtk,tui --workspace --exclude kubeui --no-fail-fast
      - name: Clippy (gtk + tui features)
        run: cargo clippy --features gtk,tui --workspace --exclude kubeui -- -D warnings
      # Both backends registered at once, so the artifact from this job is
      # the full cross-backend matrix rather than a single column.
      - name: Conformance matrix (gtk + tui)
        run: cargo test -p quadraui --features gtk,tui --test conformance -- --nocapture
      - name: Upload conformance matrix (gtk + tui)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix-gtk-tui
          path: target/conformance-matrix.txt
          if-no-files-found: warn

  downstream:
    # Compile truth for the two external consumers (#528). quadraui is
    # `publish = false`, nothing pins a published version, and vimcode's own
    # CI clones this repo's `develop` tip by relative path — so quadraui
    # being green here has historically proven nothing about the consumers
    # (#476 broke both on 2026-08-05, silently, until their next CI run).
    # This job clones both consumers as siblings of this checkout so
    # vimcode's `path = "../quadraui/quadraui"` dep resolves straight onto
    # the PR's quadraui. coord-tui no longer has a path dep at all — since
    # claude-coordinator#1973 it pins `quadraui` to a fixed git rev — so for
    # coord-tui specifically, the steps below also drop a `.cargo/config.toml`
    # `paths` override into its checkout to redirect that pinned dep onto
    # the sibling checkout too — and, because cargo discovers that config by
    # walking up from the *process CWD* and not from `--manifest-path`, every
    # cargo step below sets `working-directory:` into the consumer rather
    # than passing `--manifest-path` from the workspace root. Getting that
    # wrong makes the override a no-op and the coord-tui leg silently inert;
    # a `cargo metadata` assertion below fails the job loudly if it ever
    # regresses. Both consumers are then `cargo check --all-targets`ed.
    name: downstream consumers (compile truth)
    runs-on: ubuntu-latest
    env:
      # The workflow-level `RUSTFLAGS: "-D warnings"` above applies to every
      # job unless overridden. A `#[deprecated]` shim — the entire point of
      # PRIMITIVE_RULES.md rule 8's deprecate-then-remove protocol — emits a
      # *warning* in consumer code that references the deprecated item.
      # Under `-D warnings` that warning becomes a hard compile error, so
      # this gate would go red on exactly the changes authored correctly per
      # rule 8, and stay green only for the reckless ones that skip it.
      # Do NOT "tidy" this back to inheriting the workflow default.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned in rust-toolchain.toml (see its header comment
      # for why); rustup's own override resolution honors that file
      # regardless of what this action installs as its "default". Consumer
      # checkouts below have no such pin, so they build with whatever this
      # step resolves as "stable" — that's intentional, it's their toolchain
      # choice to make, not ours to impose via this gate.
      - uses: dtolnay/rust-toolchain@stable

      # vimcode's manifest declares `default = ["gui"]`, and `gui` pulls
      # `gtk4`/`pangocairo` plus `quadraui/gtk` — so a *default-features*
      # vimcode check needs the same GTK4 dev headers the `gtk` job above
      # installs, or its gtk4 build script dies at pkg-config time. That
      # failure would hit the PR leg and the control leg identically, so the
      # "pre-existing breakage" branch below would swallow it and the vimcode
      # leg would be permanently inert — the same silent-green failure mode
      # #528 exists to prevent. Installing the headers instead of dropping to
      # `--no-default-features` also means quadraui's GTK backend surface
      # gets consumer compile-truth, which is the point of epic #479.
      - name: Install GTK4 system libraries (vimcode's default features need them)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev

      - name: Clone consumers as siblings of this checkout
        run: |
          set -euo pipefail
          P="$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 https://github.com/JDonaghy/claude-coordinator "$P/claude-coordinator"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/vimcode "$P/vimcode"

      # coord-tui's Cargo.toml stopped being a path dependency in
      # claude-coordinator#1973 (2026-08-10): it now pins
      # `quadraui = { git = "...", rev = "<fixed sha>" }`. A git+rev source
      # is resolved from GitHub, completely independent of the sibling
      # checkout above — so without this step, `cargo check` on coord-tui
      # would silently build against that fixed rev forever, never against
      # this PR's quadraui, and this whole leg of the gate would be inert.
      # The consumer side already ships the fix for exactly this case: a
      # `.cargo/config.toml` `paths` override
      # (`tui/cargo-config-local-quadraui.toml.example`) that redirects the
      # `quadraui` package (matched by name+version, not by source) to a
      # local checkout regardless of what's pinned in Cargo.toml. Copy it
      # into place so the PR-side check actually exercises the PR.
      #
      # The override's `paths = ["../../quadraui/quadraui"]` is resolved
      # relative to the directory holding the `.cargo` dir (i.e. `tui/`), so
      # it lands on `<parent-of-checkout>/quadraui/quadraui` — exactly where
      # the clone step above puts things. Verified empirically, not from
      # memory, with cargo 1.97.1.
      - name: Point coord-tui at this PR's quadraui, not its pinned git rev
        run: |
          set -euo pipefail
          D="$(dirname "$GITHUB_WORKSPACE")/claude-coordinator/tui"
          SRC="$D/cargo-config-local-quadraui.toml.example"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC is gone — coord-tui's local-quadraui override template was renamed or removed upstream. This gate cannot redirect coord-tui's pinned git dep onto this PR's quadraui without it, so it would silently test nothing. Fix the path here rather than deleting the step."
            exit 1
          fi
          mkdir -p "$D/.cargo"
          cp "$SRC" "$D/.cargo/config.toml"

      # Placed after the consumer clone (and the coord-tui .cargo override
      # above) so the action's Cargo.lock hashing can actually see the
      # consumer manifests it's told to cache below — caching this job at
      # its default $GITHUB_WORKSPACE-only scope would miss both consumer
      # builds entirely, since every real `cargo check` in this job targets
      # a sibling directory outside the checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ../claude-coordinator/tui -> target
            ../vimcode -> target

      # cargo check, not build/test: the question this job answers is
      # "does this compile against the consumer's tree", not "is the
      # consumer correct" — each consumer runs its own tests in its own CI.
      #
      # `--all-targets` is not optional here. A bare `cargo check` compiles
      # only lib/bin targets, and quadraui's single most-consumed public
      # surface — `quadraui::tui::testing::{TuiDriver, driver_with_shell}`,
      # 242 call sites in coord-tui — is referenced *exclusively* from
      # coord-tui's test targets. Measured: renaming `driver_with_shell` in
      # this repo leaves a bare `cargo check` on coord-tui at exit 0 (green,
      # gate blind) and takes `--all-targets` to exit 101 with the expected
      # E0432. Dropping the flag re-opens a consumer-hit-shaped hole.
      #
      # Features: coord-tui's dep line already pins
      # `features = ["tui","terminal"]` in its own Cargo.toml, so this
      # inherits that. vimcode is checked with its *default* features, which
      # is `["gui"]` — hence the GTK4 apt step above; that also gets
      # quadraui's GTK backend covered, not just the TUI one.
      #
      # ── `working-directory:` is load-bearing on every cargo step below ──
      # Cargo discovers `.cargo/config.toml` by walking up from the invoking
      # process's *current directory*, NOT from `--manifest-path`'s directory.
      # So `cargo check --manifest-path .../tui/Cargo.toml` run from
      # $GITHUB_WORKSPACE (the default CWD) never sees the `paths` override
      # written above, and quietly resolves `quadraui` from the pinned git
      # rev instead — the whole coord-tui leg silently decoupled from the PR.
      # Verified with cargo 1.97.1 on this exact shape (git+rev dep, a
      # same-name+version local copy, a `paths` override next to the
      # manifest): invoked via `--manifest-path` from an unrelated CWD it
      # linked the *git* source; invoked with CWD inside the manifest's
      # directory it linked the *local override*. Do not "simplify" these
      # back to a bare `--manifest-path` from the workspace root.
      # vimcode has no `.cargo/config.toml` today (its build.rs resolves the
      # sibling quadraui from CARGO_MANIFEST_DIR, so it is CWD-independent),
      # but its steps below cd in too, so adding one upstream can't silently
      # re-open this same hole.
      - name: Assert coord-tui actually resolves quadraui to this PR's checkout
        working-directory: ../claude-coordinator/tui
        run: |
          set -euo pipefail
          want="$(cd ../../quadraui/quadraui && pwd -P)/Cargo.toml"
          got="$(cargo metadata --format-version 1 \
                 | jq -r '.packages[] | select(.name=="quadraui") | .manifest_path')"
          echo "quadraui resolved to: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::coord-tui resolved quadraui to '$got', expected this PR's checkout at '$want'. The .cargo/config.toml paths override did not take effect, so this gate would build coord-tui against its pinned git rev and prove nothing about this PR. Failing loudly rather than passing silently."
            exit 1
          fi

      - name: cargo check — coord-tui (this PR's quadraui)
        id: pr_coord_tui
        continue-on-error: true
        working-directory: ../claude-coordinator/tui
        run: cargo check --all-targets

      # vimcode's build.rs (vimcode#638) panics before compiling any real
      # source if the sibling quadraui checkout's HEAD doesn't exactly match
      # the SHA pinned in `quadraui-pin.txt` — which the tip clone above
      # never will, since this job floats both the PR's and develop's
      # quadraui rather than the one specific SHA vimcode happens to have
      # pinned. Left unset, that panic fires unconditionally on every run
      # (PR side and control side alike), so pr_vimcode and control_vimcode
      # would always fail identically and the "pre-existing breakage"
      # classification below would swallow every real signal. vimcode ships
      # an escape hatch for exactly this — building against a deliberately
      # different quadraui rev — documented in `quadraui-pin.txt`:
      # VIMCODE_QUADRAUI_UNPINNED=1 downgrades the mismatch to a warning and
      # lets the build proceed to actually compile against the checked-out
      # quadraui. Never set this for a normal vimcode dev build; it is
      # correct here because floating both sides of the comparison against
      # the pin is the entire point of this job.
      - name: cargo check — vimcode (this PR's quadraui)
        id: pr_vimcode
        continue-on-error: true
        working-directory: ../vimcode
        env:
          VIMCODE_QUADRAUI_UNPINNED: "1"
        run: cargo check --all-targets

      # A consumer can be red for reasons that have nothing to do with this
      # PR: its own bug, or mid-migration during PR 2 of a rule-8
      # deprecation. Don't hold quadraui hostage to that. Only run this
      # control when at least one PR-quadraui check above failed. This clone
      # step always clones *both* consumers when it runs at all (cheap: one
      # shallow clone each) — the actual per-consumer scoping happens on the
      # `cargo check — control` steps below via their own `if:`, which only
      # build the consumer(s) whose PR-side check actually failed. This is
      # still the expensive path and most PRs never touch it.
      - name: Clone develop's tip quadraui + consumers as control
        if: steps.pr_coord_tui.outcome == 'failure' || steps.pr_vimcode.outcome == 'failure'
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/control"
          mkdir -p "$C"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/quadraui "$C/quadraui"
          git clone --depth 1 https://github.com/JDonaghy/claude-coordinator "$C/claude-coordinator"
          git clone --depth 1 --branch develop https://github.com/JDonaghy/vimcode "$C/vimcode"

      # Same git+rev-vs-path-override problem as the PR-side check above,
      # applied to the control clone. The control tree mirrors the sibling
      # layout ($RUNNER_TEMP/control/{quadraui,claude-coordinator,vimcode}),
      # so the template's `../../quadraui/quadraui` resolves onto the
      # develop-tip quadraui cloned alongside it — same relative shape, just
      # rooted at $RUNNER_TEMP/control instead of the workspace's parent.
      - name: Point coord-tui (control) at develop's tip quadraui
        if: steps.pr_coord_tui.outcome == 'failure'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/control/claude-coordinator/tui"
          SRC="$D/cargo-config-local-quadraui.toml.example"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC is gone — see the PR-side step's error for context."
            exit 1
          fi
          mkdir -p "$D/.cargo"
          cp "$SRC" "$D/.cargo/config.toml"

      # Control-side twin of the PR-side assertion. Without it, a control run
      # that silently fell back to the pinned git rev would look "green" and
      # be read as proof the PR broke coord-tui — the opposite error, and
      # just as misleading.
      - name: Assert coord-tui (control) resolves quadraui to develop's tip
        if: steps.pr_coord_tui.outcome == 'failure'
        working-directory: ${{ runner.temp }}/control/claude-coordinator/tui
        run: |
          set -euo pipefail
          want="$(cd ../../quadraui/quadraui && pwd -P)/Cargo.toml"
          got="$(cargo metadata --format-version 1 \
                 | jq -r '.packages[] | select(.name=="quadraui") | .manifest_path')"
          echo "quadraui resolved to: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::coord-tui (control) resolved quadraui to '$got', expected develop's tip at '$want'. The .cargo/config.toml paths override did not take effect, so the control leg is not a valid comparison against the PR leg."
            exit 1
          fi

      # `working-directory:` here for the same load-bearing reason as the
      # PR-side check — see the comment on that step.
      - name: cargo check — coord-tui (control, develop's tip quadraui)
        if: steps.pr_coord_tui.outcome == 'failure'
        id: control_coord_tui
        continue-on-error: true
        working-directory: ${{ runner.temp }}/control/claude-coordinator/tui
        run: cargo check --all-targets

      - name: cargo check — vimcode (control, develop's tip quadraui)
        if: steps.pr_vimcode.outcome == 'failure'
        id: control_vimcode
        continue-on-error: true
        working-directory: ${{ runner.temp }}/control/vimcode
        env:
          VIMCODE_QUADRAUI_UNPINNED: "1"
        run: cargo check --all-targets

      # This PR broke a consumer only if the PR check failed AND the control
      # (same consumer, develop's tip quadraui) succeeded. PR-red +
      # control-red means the consumer was already broken independently of
      # this PR — report it loudly, but pass, so quadraui isn't held hostage
      # to a consumer bug this PR didn't cause and can't fix.
      - name: Evaluate — did this PR break a consumer, or was it already broken?
        if: always()
        run: |
          fail=0
          if [ "${{ steps.pr_coord_tui.outcome }}" = "failure" ]; then
            if [ "${{ steps.control_coord_tui.outcome }}" = "failure" ]; then
              echo "::warning::coord-tui also fails to compile against develop's tip quadraui — pre-existing consumer breakage, not caused by this PR. Not failing this gate."
            else
              echo "::error::coord-tui fails to compile against this PR's quadraui but builds fine against develop's tip. This PR broke coord-tui."
              fail=1
            fi
          fi
          if [ "${{ steps.pr_vimcode.outcome }}" = "failure" ]; then
            if [ "${{ steps.control_vimcode.outcome }}" = "failure" ]; then
              echo "::warning::vimcode also fails to compile against develop's tip quadraui — pre-existing consumer breakage, not caused by this PR. Not failing this gate."
            else
              echo "::error::vimcode fails to compile against this PR's quadraui but builds fine against develop's tip. This PR broke vimcode."
              fail=1
            fi
          fi
          exit "$fail"
