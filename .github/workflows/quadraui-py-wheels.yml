name: quadraui-py wheels

# Builds an abi3 wheel for `quadraui-py` on each of the three platforms it
# ships to, then installs the built wheel into a throwaway venv and
# imports it -- proving the wheel is actually loadable, not just that
# `maturin build` exited zero.
#
# Each OS gets the native-window feature it can actually ship as a clean
# abi3 wheel:
#   - macOS: `macos` (Core Graphics/AppKit via `objc2`) links against system
#     frameworks every Mac already has -- no bundling problem.
#   - Windows: `win` (Direct2D/DirectWrite) links against system DLLs every
#     Windows install already has -- same story.
#   - Linux: two wheels. The `build` job's `manylinux: auto` wheel carries
#     no native feature and covers every glibc >= 2.17 host for `run_tui`
#     and the headless driver. The `linux-gtk` job builds a second,
#     `manylinux_2_39` wheel that carries the same GTK-free extension plus
#     a GTK-enabled variant (`_quadraui_gtk`) linking the system GTK 4
#     stack dynamically; `python/quadraui/_ext.py` loads the GTK variant
#     when the host can, and falls back to the GTK-free one when it can't.
#     pip prefers the `manylinux_2_39` wheel wherever glibc is new enough.
#     `linux-smoke` installs both wheels into clean distro containers and
#     checks which one pip picks and what it does there. See
#     `quadraui-py/docs/LINUX_NATIVE_WHEELS.md` for the design.
#
# `abi3-py38` (set on the `pyo3` dependency itself, not a maturin flag) is
# what makes one wheel per OS/arch work across every CPython >= 3.8, so
# this matrix has no Python-version axis.
on:
  push:
    branches: [main, develop]
    paths:
      - "quadraui-py/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - ".github/workflows/quadraui-py-wheels.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "quadraui-py/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - ".github/workflows/quadraui-py-wheels.yml"
  workflow_dispatch: {}
  # Lets `quadraui-py-release.yml` build this same matrix for a tagged
  # release instead of duplicating the build-and-smoke-test steps. No
  # inputs/secrets needed — the caller only cares about the uploaded
  # `quadraui-py-wheel-*` artifacts this workflow already produces.
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  bump-shape:
    # A release's bump PR (`release-X.Y.Z` -> `develop`) only ever touches
    # `quadraui/Cargo.toml`/`quadraui/src/lib.rs` from the `paths:` entries
    # above that can trigger this workflow — `scripts/release.py prepare`'s
    # own file set — so it never touches `quadraui-py`/`quadraui-binding-
    # core` or bumps `quadraui-py`'s own version, yet without this gate it
    # still runs the full 3-OS wheel-build-and-smoke matrix below. Same
    # detector `ci.yml`'s own `bump-shape` job uses (`tools/
    # changelog_check.py --print-bump-shape`), duplicated here rather than
    # shared via a reusable workflow because each caller needs this as one
    # job inside its own workflow run so its own jobs can `needs:` it.
    #
    # `pull_request`-only: the diff needs a base commit, which only exists
    # for a PR event. `push`/`workflow_dispatch`/`workflow_call` all skip
    # this job, leaving `is_bump` empty — every consuming job's `!= 'true'`
    # condition treats that as "run normally".
    name: Detect release-bump PR shape
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    outputs:
      # Forced `'false'` on a `develop` -> `main` promotion PR even if its
      # diff happens to be bump-shaped too — see `ci.yml`'s `bump-shape`
      # job for why a promotion PR must never skip real checks.
      is_bump: ${{ github.base_ref != 'main' && steps.detect.outputs.bump_shape }}
      # The OS legs `build` runs on this PR, as a JSON list. Empty on every
      # non-PR event, where `build` falls back to all three.
      wheel_os: ${{ steps.legs.outputs.wheel_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect bump-shaped diff
        id: detect
        run: |
          python3 tools/changelog_check.py --print-bump-shape \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      # GitHub's hosted macOS arm64 pool regularly fails to assign a runner
      # at all ("not acquired by Runner of type hosted"), which leaves a PR
      # unmergeable until someone reruns it. A PR therefore builds the
      # macOS wheel only when it changes the Python binding itself
      # (`quadraui-py`, `quadraui-binding-core`, or this workflow). A
      # `quadraui/src` change is compiled for macOS by the Test stage on a
      # Mac before review, and every `develop`/`main` push and every
      # promotion PR into `main` still builds all three wheels.
      - name: Pick wheel OS legs
        id: legs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          if [ "${{ github.base_ref }}" = main ] \
            || git diff --name-only "$BASE...$HEAD" \
              | grep -qE '^(quadraui-py/|quadraui-binding-core/|\.github/workflows/quadraui-py-wheels\.yml$)'; then
            echo "wheel_os=$all" >> "$GITHUB_OUTPUT"
          else
            echo 'wheel_os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: wheel (${{ matrix.os }})
    needs: bump-shape
    # Skipped on a bump-shaped PR — see `bump-shape`'s own comment above.
    # `!cancelled()` is load-bearing: without it, the default `if:
    # success()` on a `needs:` job would also skip this on `push`/
    # `workflow_dispatch`/`workflow_call`, where `bump-shape` itself never
    # runs.
    if: ${{ !cancelled() && needs.bump-shape.outputs.is_bump != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # The OS list comes from `bump-shape`'s `wheel_os` on a PR. Per-OS
        # settings are derived from `matrix.os` in the job `env:` below rather
        # than attached with `include:`, because an `include:` entry for an
        # OS missing from this list would add that OS back as a new leg.
        os: ${{ fromJSON(needs.bump-shape.outputs.wheel_os || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      # `pyo3/extension-module` is listed explicitly in every leg's
      # features (duplicating `pyproject.toml`'s `[tool.maturin] features`)
      # because the `Build wheel` step passes `--features` on the CLI to let
      # the macOS/Windows legs add their native feature on top, and relying
      # on maturin to merge that with `pyproject.toml`'s own `features` list
      # (rather than override it) is an assumption not worth making. This
      # job's Linux wheel has no native feature; the GTK-enabled Linux wheel
      # comes from the `linux-gtk` job below.
      CARGO_FEATURES: ${{ matrix.os == 'macos-latest' && 'pyo3/extension-module,macos' || (matrix.os == 'windows-latest' && 'pyo3/extension-module,win' || 'pyo3/extension-module') }}
      HAS_RUN_NATIVE: ${{ matrix.os != 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    # Sized generously for a cold Rust + maturin build; a healthy run is a
    # few minutes once dependencies are warm.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: quadraui-py
          args: --release --out dist --features ${{ env.CARGO_FEATURES }}
          # `auto` picks the oldest manylinux maturin supports on Linux and
          # is a no-op on macOS/Windows; there is no GTK dependency here to
          # make manylinux's older glibc/toolchain a problem.
          manylinux: auto
      # The package is dual-licensed MIT OR Apache-2.0, so every wheel must
      # carry both license texts. maturin picks up `quadraui-py/LICENSE-*`
      # automatically; this fails the leg if that ever stops happening, or if
      # a file ships with something other than the real license text.
      - name: Check the built wheel ships both license texts
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("quadraui-py/dist/*.whl")
          if not wheels:
              sys.exit("::error::no wheel found in quadraui-py/dist")
          expected = {"LICENSE-MIT": "MIT License", "LICENSE-APACHE": "Apache License"}
          failed = False
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  for name, header in expected.items():
                      hits = [
                          n for n in zf.namelist()
                          if ".dist-info/" in n and n.rsplit("/", 1)[-1] == name
                      ]
                      if not hits:
                          print(f"::error::{wheel} has no {name} in its .dist-info")
                          failed = True
                          continue
                      text = zf.read(hits[0]).decode("utf-8", "replace").lstrip()
                      if not text.startswith(header):
                          print(f"::error::{wheel}:{hits[0]} does not start with {header!r}")
                          failed = True
                      else:
                          print(f"{wheel}: {hits[0]} ok")
          sys.exit(1 if failed else 0)
          PY
      - name: Import the built wheel
        shell: bash
        run: |
          python -m venv /tmp/quadraui-py-wheel-check
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=/tmp/quadraui-py-wheel-check/Scripts/python.exe
          else
            PYTHON=/tmp/quadraui-py-wheel-check/bin/python
          fi
          "$PYTHON" -m pip install --no-index --find-links quadraui-py/dist quadraui
          "$PYTHON" -c "
          import quadraui
          print(quadraui.QuiApp)
          has_native = quadraui._quadraui._NATIVE_BACKEND is not None
          expected = '${HAS_RUN_NATIVE}' == 'true'
          assert has_native == expected, (
              f'native backend presence {has_native} != expected {expected}'
          )
          if not has_native:
              try:
                  quadraui.QuiApp(10, 3).run_native()
              except quadraui.UnsupportedError as exc:
                  print(f'run_native: {exc}')
              else:
                  raise AssertionError('run_native did not raise UnsupportedError')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: quadraui-py-wheel-${{ matrix.os }}
          path: quadraui-py/dist/*.whl
          if-no-files-found: error

  linux-gtk:
    # The GTK-enabled Linux wheel. Built on Ubuntu 24.04 (glibc 2.39, GTK
    # 4.14) rather than in a manylinux image: `quadraui`'s `gtk4` dependency
    # enables `v4_10` (it calls `GtkFileDialog`/`GtkAlertDialog`), so the
    # build needs GTK >= 4.10 headers and pkg-config metadata, which no
    # manylinux image's package repositories carry. glibc 2.39 is then the
    # wheel's floor, and it is tagged `manylinux_2_39` to match.
    name: wheel (linux, gtk)
    needs: bump-shape
    if: ${{ !cancelled() && needs.bump-shape.outputs.is_bump != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The GTK variant's `DT_NEEDED` system libraries. `auditwheel repair`
      # would otherwise copy them (and everything they load) into the
      # wheel; they must come from the host so they match its GTK, display
      # server and fonts. `Check the wheel's layout` fails the job if a new
      # dependency shows up that is not listed here.
      GTK_SYSTEM_LIBS: >-
        libgtk-4.so.1 libgdk_pixbuf-2.0.so.0 libpango-1.0.so.0
        libpangocairo-1.0.so.0 libpangoft2-1.0.so.0 libcairo.so.2
        libgobject-2.0.so.0 libglib-2.0.so.0 libgio-2.0.so.0
        libfontconfig.so.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GTK 4 development files and wheel tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
          python -m pip install "maturin>=1.5,<2.0" "auditwheel>=6.1" patchelf
      - name: Build the GTK extension variant
        run: |
          cargo build --release -p quadraui-py --lib \
            --features pyo3/extension-module,gtk-ext
          cp target/release/libquadraui_py.so \
            quadraui-py/python/quadraui/_quadraui_gtk.abi3.so
      - name: Build the wheel around both extensions
        working-directory: quadraui-py
        run: |
          maturin build --release --auditwheel skip --out raw \
            --features pyo3/extension-module
          excludes=""
          for lib in $GTK_SYSTEM_LIBS; do excludes="$excludes --exclude $lib"; done
          auditwheel repair --plat manylinux_2_39_x86_64 $excludes -w dist raw/*.whl
      - name: Check the wheel's layout
        working-directory: quadraui-py
        run: |
          python - <<'PY'
          import glob
          import subprocess
          import sys
          import tempfile
          import zipfile

          wheels = glob.glob("dist/*manylinux_2_39_x86_64.whl")
          if len(wheels) != 1:
              sys.exit(f"::error::expected one manylinux_2_39 wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              vendored = [n for n in names if n.startswith("quadraui.libs/")]
              if vendored:
                  sys.exit(f"::error::auditwheel vendored system libraries: {vendored}")
              with tempfile.TemporaryDirectory() as tmp:
                  for module, must_link_gtk in (("_quadraui", False), ("_quadraui_gtk", True)):
                      member = f"quadraui/{module}.abi3.so"
                      if member not in names:
                          sys.exit(f"::error::{member} missing from {wheels[0]}")
                      path = zf.extract(member, tmp)
                      dynamic = subprocess.run(
                          ["readelf", "-d", path], capture_output=True, text=True, check=True
                      ).stdout
                      links_gtk = "libgtk-4.so.1" in dynamic
                      print(f"{member}: links libgtk-4.so.1 = {links_gtk}")
                      if links_gtk != must_link_gtk:
                          sys.exit(f"::error::{member} links libgtk-4.so.1 = {links_gtk}")
                      if not must_link_gtk and "libglib-2.0" in dynamic:
                          sys.exit(f"::error::{member} must not need GLib")
          print(f"{wheels[0]} ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quadraui-py-wheel-linux-gtk
          path: quadraui-py/dist/*.whl
          if-no-files-found: error

  linux-smoke:
    # Installs from a directory holding both Linux wheels into clean distro
    # containers, so pip's own tag choice is under test as well as what the
    # chosen wheel does on that host (see `quadraui-py/ci/linux_wheel_smoke.py`).
    name: linux smoke (${{ matrix.name }})
    needs: [bump-shape, build, linux-gtk]
    if: ${{ !cancelled() && needs.bump-shape.outputs.is_bump != 'true' && needs.build.result == 'success' && needs.linux-gtk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04 + gtk4
            image: ubuntu:24.04
            mode: gtk
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              python3 python3-venv libgtk-4-1 xvfb dbus fonts-dejavu-core
          - name: fedora-42 + gtk4
            image: fedora:42
            mode: gtk
            install: >-
              dnf install -y python3 gtk4 xorg-x11-server-Xvfb dbus-daemon
              dejavu-sans-fonts
          - name: ubuntu-24.04 without gtk4
            image: ubuntu:24.04
            mode: missing-gtk
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              python3 python3-venv
          - name: debian-12 (glibc 2.36)
            image: debian:12
            mode: tui-only
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              python3 python3-venv
    container: ${{ matrix.image }}
    steps:
      - name: Install distro packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quadraui-py-wheel-ubuntu-latest
          path: wheels
      - uses: actions/download-artifact@v4
        with:
          name: quadraui-py-wheel-linux-gtk
          path: wheels
      - name: Install and check
        shell: bash
        env:
          # A container has no GPU device for GTK's GL renderer; the Cairo
          # renderer paints through the same widget tree without one.
          GSK_RENDERER: cairo
        run: |
          ls wheels
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links wheels quadraui
          if [ "${{ matrix.mode }}" = gtk ]; then
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            sleep 2
            dbus-run-session -- /tmp/venv/bin/python quadraui-py/ci/linux_wheel_smoke.py gtk
          else
            /tmp/venv/bin/python quadraui-py/ci/linux_wheel_smoke.py "${{ matrix.mode }}"
          fi
