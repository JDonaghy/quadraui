name: quadraui-node build

# Builds `@quadraui/node`'s native addon from source, compiles `js/**` to
# `dist/` (`build:dist`: CommonJS plus a generated `.d.ts` per module, the
# files every `exports` entry points at), type-checks `examples/*.ts` and
# the generated declarations under `tsc --strict --noEmit`, runs this
# package's own black-box `node --test` suite and every example headlessly
# (in-repo, the tests and examples import the package by its own name, so
# they run against that same `dist/` build), then runs
# `scripts/pack_smoke.ts`: `npm pack` of the root and the three platform
# packages, a clean install of the root plus this host's platform tarball
# into a temp project, `require()` and `import` of every subpath from
# `node_modules`, `tsc --strict --module node16` of a typed
# `@quadraui/node/app` consumer, and the hero counter run headless and in a
# live TUI. Mirrors `quadraui-py-tests` (`ci.yml`) for the test half and
# `quadraui-py-wheels.yml`'s "build artifact, then prove it is loadable"
# shape for the pack half.
#
# One platform (`ubuntu-latest`), build-from-source only: this workflow is
# the push/PR smoke test, not the release build. `quadraui-node-release.yml`
# is the tag-triggered workflow that builds and publishes the prebuilt
# `.node` binary for each of the three platforms `@quadraui/node` ships
# (macOS arm64, Linux x86_64, Windows x86_64) and runs the same pack smoke
# test on each of them before anything is published.
#
# `build:dist` needs the napi-generated `index.d.ts` (`js/index.ts` imports
# `../index.js`), which only a prior `napi build`/`build:debug`/`build` run
# produces -- it is gitignored, not checked in -- so this job always runs
# `build:debug` first.
#
# Node 24 runs this package's own `.ts` tests, examples and scripts
# directly (type stripping); the published package itself is compiled
# JavaScript and needs only the `engines` floor.
on:
  push:
    branches: [main, develop]
    paths:
      - "quadraui-node/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - "examples/hero/**"
      - ".github/workflows/quadraui-node-build.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "quadraui-node/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - "examples/hero/**"
      - ".github/workflows/quadraui-node-build.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  bump-shape:
    # A release's bump PR (`release-X.Y.Z` -> `develop`) only ever touches
    # `quadraui/Cargo.toml`/`quadraui/src/lib.rs` from the `paths:` entries
    # above that can trigger this workflow — `scripts/release.py prepare`'s
    # own file set — so it never touches `quadraui-node`/`quadraui-binding-
    # core`, yet without this gate it still runs the full native-addon
    # build + test + pack below. Same detector `ci.yml`'s own `bump-shape`
    # job uses (`tools/changelog_check.py --print-bump-shape`), duplicated
    # here rather than shared via a reusable workflow because each caller
    # needs this as one job inside its own workflow run so its own jobs
    # can `needs:` it.
    #
    # `pull_request`-only: the diff needs a base commit, which only exists
    # for a PR event. `push`/`workflow_dispatch` both skip this job,
    # leaving `is_bump` empty — the consuming job's `!= 'true'` condition
    # treats that as "run normally".
    name: Detect release-bump PR shape
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    outputs:
      # Forced `'false'` on a `develop` -> `main` promotion PR even if its
      # diff happens to be bump-shaped too — see `ci.yml`'s `bump-shape`
      # job for why a promotion PR must never skip real checks.
      is_bump: ${{ github.base_ref != 'main' && steps.detect.outputs.bump_shape }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect bump-shaped diff
        id: detect
        run: |
          python3 tools/changelog_check.py --print-bump-shape \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  build:
    name: npm test (plain build) + npm pack
    runs-on: ubuntu-latest
    needs: bump-shape
    # Skipped on a bump-shaped PR — see `bump-shape`'s own comment above.
    # `!cancelled()` is load-bearing: without it, the default `if:
    # success()` on a `needs:` job would also skip this on `push`/
    # `workflow_dispatch`, where `bump-shape` itself never runs.
    if: ${{ !cancelled() && needs.bump-shape.outputs.is_bump != 'true' }}
    # Sized generously for a cold Rust + napi build; a healthy run is a
    # few minutes once dependencies are warm.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quadraui-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install npm dependencies
        run: npm ci
      - name: Build the native addon (plain/debug build)
        run: npm run build:debug
      - name: Compile js/ to dist/
        run: npm run build:dist
      - name: Type-check examples (tsc --strict --noEmit)
        run: npm run typecheck:examples
      - name: Type-check the generated declarations (tsc --strict --noEmit)
        run: npm run typecheck:dist-types
      - name: npm test
        run: npm test
      - name: Run every example headlessly
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*.ts; do
            echo "::group::node $example"
            node "$example"
            echo "::endgroup::"
          done
      - name: Install tmux for the live TUI check
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Pack all four packages, install into a clean project, run the hero counter
        run: node scripts/pack_smoke.ts --live
