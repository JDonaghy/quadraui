name: quadraui-node build

# Builds `@quadraui/node`'s native addon from source, type-checks
# `examples/*.ts` under `tsc --strict --noEmit` (`package.json`'s
# `typecheck:examples` script) and runs each of them headlessly, runs this
# package's own black-box `node --test` suite (headless
# `QuiApp`/`QuiShellApp` surface, plus the `QuadrauiError` subclass export
# check in `tests/public_api.test.ts`), then `npm pack`s the result and
# `require()`s the packed tarball from a separate throwaway directory --
# proving the package a consumer would actually install loads and raises
# typed errors, not just that this workspace's own build-tree layout
# happens to resolve. Mirrors `quadraui-py-tests` (`ci.yml`) for the test
# half and `quadraui-py-wheels.yml`'s "build artifact, then prove it is
# loadable" shape for the pack half.
#
# One platform (`ubuntu-latest`), build-from-source only: `@quadraui/node`
# ships no prebuilt `.node` binary per platform yet (`package.json`'s own
# `"private": true` -- there is no npm-publish decision for this package
# the way `quadraui-py-release.yml` has one for PyPI), so there is no
# `quadraui-py-wheels.yml`-style OS matrix to run here. A consumer on any
# platform builds from source the same way this job does, via `napi
# build`'s own per-platform target detection; add a prebuilt-binary matrix
# (and a `quadraui-node-release.yml` publish workflow) once this package
# has that decision made for it.
#
# `npm pack`'s own `prepack` lifecycle hook (`package.json`'s `build:dist`
# script) compiles `js/index.ts` to `dist/index.js` and copies its
# hand-maintained sibling declaration (`js/index.d.ts`) to
# `dist/index.d.ts` before packing -- this package's `main`/`types` point
# there, so a consumer's `require("@quadraui/node")` resolves one compiled
# entry point rather than the `.ts` source tree, reconciled with the
# native, napi-generated `index.d.ts` (`js/index.d.ts`'s own header doc).
#
# Node >= 23.6 is pinned below because every *other* subpath export
# (`./app`, `./app/*`, `./testing`, `./jsx-runtime`, `./jsx-dev-runtime`)
# still points straight at its own `.ts` source, `require()`d directly
# (see `js/index.ts`'s own header doc for why) -- Node's type-stripping
# only erases TypeScript syntax from a `.ts` file by default from that
# version on; an older Node needs `--experimental-strip-types` explicitly,
# which neither this package's own `npm test`/example scripts nor a
# consumer's plain `require()` pass.
on:
  push:
    branches: [main, develop]
    paths:
      - "quadraui-node/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - ".github/workflows/quadraui-node-build.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "quadraui-node/**"
      - "quadraui-binding-core/**"
      - "quadraui/src/**"
      - "quadraui/Cargo.toml"
      - ".github/workflows/quadraui-node-build.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  bump-shape:
    # A release's bump PR (`release-X.Y.Z` -> `develop`) only ever touches
    # `quadraui/Cargo.toml`/`quadraui/src/lib.rs` from the `paths:` entries
    # above that can trigger this workflow — `scripts/release.py prepare`'s
    # own file set — so it never touches `quadraui-node`/`quadraui-binding-
    # core`, yet without this gate it still runs the full native-addon
    # build + test + pack below. Same detector `ci.yml`'s own `bump-shape`
    # job uses (`tools/changelog_check.py --print-bump-shape`), duplicated
    # here rather than shared via a reusable workflow because each caller
    # needs this as one job inside its own workflow run so its own jobs
    # can `needs:` it.
    #
    # `pull_request`-only: the diff needs a base commit, which only exists
    # for a PR event. `push`/`workflow_dispatch` both skip this job,
    # leaving `is_bump` empty — the consuming job's `!= 'true'` condition
    # treats that as "run normally".
    name: Detect release-bump PR shape
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    outputs:
      # Forced `'false'` on a `develop` -> `main` promotion PR even if its
      # diff happens to be bump-shaped too — see `ci.yml`'s `bump-shape`
      # job for why a promotion PR must never skip real checks.
      is_bump: ${{ github.base_ref != 'main' && steps.detect.outputs.bump_shape }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect bump-shaped diff
        id: detect
        run: |
          python3 tools/changelog_check.py --print-bump-shape \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  build:
    name: npm test (plain build) + npm pack
    runs-on: ubuntu-latest
    needs: bump-shape
    # Skipped on a bump-shaped PR — see `bump-shape`'s own comment above.
    # `!cancelled()` is load-bearing: without it, the default `if:
    # success()` on a `needs:` job would also skip this on `push`/
    # `workflow_dispatch`, where `bump-shape` itself never runs.
    if: ${{ !cancelled() && needs.bump-shape.outputs.is_bump != 'true' }}
    # Sized generously for a cold Rust + napi build; a healthy run is a
    # few minutes once dependencies are warm.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quadraui-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install npm dependencies
        run: npm ci
      - name: Build the native addon (plain/debug build)
        run: npm run build:debug
      - name: Type-check examples (tsc --strict --noEmit)
        run: npm run typecheck:examples
      - name: npm test
        run: npm test
      - name: Run every example headlessly
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*.ts; do
            echo "::group::node $example"
            node "$example"
            echo "::endgroup::"
          done
      - name: npm pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Verify the packed tarball is loadable and raises typed errors
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="$RUNNER_TEMP/quadraui-node-pack-check"
          mkdir -p "$pkg_dir"
          tar -xf "$RUNNER_TEMP"/quadraui-node-*.tgz -C "$pkg_dir"
          node -e "
          const quadraui = require('$pkg_dir/package');
          const app = new quadraui.QuiApp(5, 5);
          if (typeof app.screen() !== 'string') {
            throw new Error('screen() did not return a string');
          }
          try {
            app.slotClear(999);
            throw new Error('slotClear(999) did not raise');
          } catch (err) {
            if (!(err instanceof quadraui.UnknownSlotError) || !(err instanceof quadraui.QuadrauiError)) {
              throw new Error('slotClear(999) did not raise an UnknownSlotError/QuadrauiError: ' + err);
            }
          }
          console.log('packed @quadraui/node is loadable and raises typed errors');
          "
