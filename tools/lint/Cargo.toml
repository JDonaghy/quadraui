[package]
name = "quadraui-repo-lint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = """
Maintainer-workflow guards for the quadraui repo (#1110): assertions about
CLAUDE.md/ci.yml wording, .githooks/ behaviour, and Cargo.toml example
manifest hygiene. Run explicitly by CI as a binary, never picked up by a
plain `cargo test` — see src/main.rs module docs for why that split exists.
"""

[[bin]]
name = "lint"
path = "src/main.rs"

[dependencies]
tempfile = "3"
