[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quadraui"
# Versioned on its own line: the Python binding's surface is a narrower,
# slower-moving subset of the Rust API (see `quadraui-py/src/lib.rs`), so a
# crate patch release does not force a PyPI release and vice versa. The
# minor component must equal `quadraui/Cargo.toml`'s own minor — see
# `quadraui/docs/decisions/BINDING_VERSION_POLICY.md`, enforced in CI by
# `scripts/release_decide.py check-binding-versions` — while the patch
# component is free to move independently.
# Tagged and published by `.github/workflows/quadraui-py-release.yml` off a
# `py-v<version>` tag, which asserts this field matches the tag before
# building anything.
version = "0.10.1"
description = "Python bindings for quadraui: insert descriptors and render them headlessly."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]

# Registers `quadraui.testing`'s `quadraui_harness` fixture with `pytest`,
# so a consumer testing their own app gets it without a `conftest.py`. The
# module `pytest` imports for this is pure Python and imports nothing from
# the compiled extension (see its own docstring) — loading it must never be
# able to break an unrelated `pytest` run in the same environment.
[project.entry-points.pytest11]
quadraui = "quadraui.testing.pytest_plugin"

[project.urls]
Homepage = "https://jdonaghy.github.io/quadraui/"
Documentation = "https://jdonaghy.github.io/quadraui/"
Repository = "https://github.com/JDonaghy/quadraui"
Issues = "https://github.com/JDonaghy/quadraui/issues"

[tool.maturin]
# Compiled extension lives at `quadraui/_quadraui` underneath the pure-Python
# package in `python/quadraui/`, which re-exports its public names — see
# `python/quadraui/__init__.py`.
module-name = "quadraui._quadraui"
python-source = "python"
features = ["pyo3/extension-module"]
