[package]
name = "quadraui-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PyO3 bindings: insert quadraui descriptors from Python and render them headlessly."

[lib]
name = "quadraui_py"
# `cdylib` is what maturin loads as the Python extension module. `rlib` is
# reserved for a future in-crate `#[cfg(test)]` harness that links this
# crate as a normal Rust test dependency — a pure `cdylib` can't be used
# that way. No such harness exists yet; `pytest` (`quadraui-py/tests/`)
# is what currently exercises the built extension.
crate-type = ["cdylib", "rlib"]

[dependencies]
quadraui = { path = "../quadraui", features = ["tui"] }
pyo3 = { version = "0.29", features = ["abi3-py38"] }
pythonize = "0.29"
serde = "1.0"
