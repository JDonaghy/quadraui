[package]
name = "quadraui-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PyO3 bindings: insert quadraui descriptors from Python and render them headlessly."

[lib]
name = "quadraui_py"
# `cdylib` is what maturin loads as the Python extension module; `rlib` lets
# this crate's own `#[cfg(test)] cargo test -p quadraui-py` link normally
# (a pure `cdylib` can't be used as a test harness dependency).
crate-type = ["cdylib", "rlib"]

[dependencies]
quadraui = { path = "../quadraui", features = ["tui"] }
pyo3 = { version = "0.29", features = ["abi3-py38"] }
pythonize = "0.29"
serde = "1.0"
