[book]
title = "quadraui"
description = "One Rust UI codebase that runs in a terminal and as a native desktop window."
authors = ["quadraui contributors"]
language = "en"
src = "src"

# `src/SUMMARY.md` and `src/gallery/` are generated by `tools/site_gen.py`
# from `quadraui-gallery`'s own registry + capture manifest (#1349) — see
# `../.github/workflows/pages.yml` for the build step that runs it before
# this config is used. `src/introduction.md` and `src/getting-started.md`
# are the only hand-maintained chapters.

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/JDonaghy/quadraui"
edit-url-template = "https://github.com/JDonaghy/quadraui/edit/develop/site/src/{path}"
# A project Pages site is served from `/quadraui/`, not `/`. mdBook's
# generated 404 page renders absolute links, which need this set to
# resolve correctly instead of pointing at the Pages user root.
site-url = "/quadraui/"
