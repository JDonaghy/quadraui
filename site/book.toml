[book]
title = "quadraui"
description = "A cross-platform UI framework for Rust, Python and Node.js that also runs in a terminal."
authors = ["quadraui contributors"]
language = "en"
src = "src"

# `src/SUMMARY.md` and `src/gallery/` are generated by `tools/site_gen.py`
# from `quadraui-gallery`'s own registry + capture manifest (#1349) and the
# hand-written navigation in `SUMMARY.template.md` — see
# `../scripts/site_gallery.sh` and `../.github/workflows/pages.yml` for the
# step that runs it before this config is used. Every other page under
# `src/` is hand-maintained.

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/JDonaghy/quadraui"
edit-url-template = "https://github.com/JDonaghy/quadraui/edit/develop/site/src/{path}"
# A project Pages site is served from `/quadraui/`, not `/`. mdBook's
# generated 404 page renders absolute links, which need this set to
# resolve correctly instead of pointing at the Pages user root.
site-url = "/quadraui/"

# The gallery nests every widget under its group; keep those folded so the
# sidebar stays scannable.
[output.html.fold]
enable = true
level = 1
