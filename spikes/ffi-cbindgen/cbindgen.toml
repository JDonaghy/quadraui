language = "C"
header = "Spike evidence header for #1640. Not a shippable quadraui-ffi artifact."
include_guard = "QUADRAUI_FFI_CBINDGEN_SPIKE_H"
autogen_warning = "/* Generated by cbindgen from spikes/ffi-cbindgen/src/lib.rs. DO NOT EDIT BY HAND. */"
style = "both"

# Rust type names already carry a `Quadra` prefix (`QuadraStore`,
# `QuadraRunner`, `QuadraCallbacks`, `QuadraStepOutcome`), so no
# `[export] prefix` here — adding one doubles up to `QuadraQuadraStore`.

[fn]
prefix = "/* extern \"C\" */"
