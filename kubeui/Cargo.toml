[package]
name = "kubeui"
version = "0.0.1"
edition.workspace = true
description = "TUI Kubernetes dashboard built on quadraui (kubeui-core consumer)"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kubeui"
path = "src/main.rs"

[dependencies]
# `quadraui::tui::run` drives `kubeui_core::KubeApp`; it owns terminal
# setup/teardown, the crossterm event loop, and ratatui rasterisers —
# this binary has no direct ratatui/crossterm/tokio dependency of its
# own (the `tokio::Runtime` the k8s client needs is owned inside
# `KubeApp`, in `kubeui-core`).
quadraui = { path = "../quadraui", features = ["tui"] }
kubeui-core = { path = "../kubeui-core" }

anyhow = "1.0"
