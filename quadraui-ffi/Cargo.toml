[package]
name = "quadraui-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Spike: a cbindgen-generated C ABI over quadraui's TUI backend."

[lib]
name = "quadraui_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
quadraui = { path = "../quadraui", features = ["tui"] }
serde_json = "1.0"

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
cbindgen = "0.29"
