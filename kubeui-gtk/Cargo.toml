[package]
name = "kubeui-gtk"
version = "0.0.1"
edition.workspace = true
description = "GTK4 Kubernetes dashboard built on quadraui (kubeui-core consumer)"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kubeui-gtk"
path = "src/main.rs"

[dependencies]
# `quadraui::gtk::run` drives `kubeui_core::KubeApp`; it owns the
# `gtk4::Application`, window, drawing area, and event controllers —
# this binary has no direct gtk4/pangocairo/tokio dependency of its
# own (the `tokio::Runtime` the k8s client needs is owned inside
# `KubeApp`, in `kubeui-core`).
quadraui = { path = "../quadraui", features = ["gtk"] }
kubeui-core = { path = "../kubeui-core" }
