# Acceptance manifest for milestone ms-11 ("Backend conformance suite",
# epic #480). See contract.md — this file is its machine-readable half.
#
# Test-ids are the libtest `name` emitted by
#   cd quadraui && cargo test --test acceptance --features tui,gtk
# (module-qualified fn path). Slice files live in this directory and are
# `include!`d below the SEALED marker in `quadraui/tests/acceptance.rs`,
# which is declared as this driver's `entrypoint:` in the fleet config.
#
# Merged (never clobbered) across issues by coord.acceptance.load_manifest,
# so each issue's JIT-authored slice appends its own entries here.

tests:
  # ── #554 — wide-glyph tab labels (contract §3) ─────────────────────────
  # Slice: wide_tab_labels.rs, `include!`d from quadraui/tests/acceptance.rs.
  # All assertions go through `find_bounds`/`click_text`, never
  # `screen_contains` — for this issue that readback is INVERTED (contract
  # §2), and the mock is illustrative only (contract §8).
  ms11_554_wide_tab_labels::wide_label_paints_every_glyph_in_its_own_columns: 554  # §3c
  ms11_554_wide_tab_labels::ascii_label_is_unchanged: 554                          # §3d
  ms11_554_wide_tab_labels::measured_tab_budget_matches_the_painted_width: 554     # §3e
  ms11_554_wide_tab_labels::click_on_wide_label_activates_the_painted_tab: 554     # §3g
  ms11_554_wide_tab_labels::emoji_label_paints_every_glyph: 554                    # §3h

  # ── #542 — structural parity tier (contract §4) ───────────────────────
  # Slice: structural_parity.rs, `include!`d from quadraui/tests/acceptance.rs.
  # Authored only now that #490 has merged (939bbb6), per contract §4c: the
  # clauses assert on `FrameInventory.zones()`, which was
  # declared-but-always-empty before that, so an earlier slice would have
  # been red for a reason that is not #542's implementation.
  #
  # TWO TIERS, deliberately separate test fns (#542 acceptance bullet 3 —
  # "behavioural and structural failures are distinguishable from the test
  # output alone"). Every message carries a `BEHAVIOURAL PARITY (tier A)` /
  # `STRUCTURAL PARITY (tier B)` prefix.
  #
  # tier A — the CONTROL half, green today and expected to stay green: a
  # backend that drops the tooltip's border still passes these, which is
  # the gap #542 reports (contract §4b).
  ms11_542_structural_parity::behavioural_parity_tooltip_text_reaches_every_backend: 542
  ms11_542_structural_parity::behavioural_parity_status_bar_text_reaches_every_backend: 542
  # tier B — red today: `draw_tooltip` registers no zone on either backend,
  # so the frame reports no tooltip surface at all.
  ms11_542_structural_parity::structural_parity_every_backend_reports_the_tooltip_surface: 542       # §4b
  ms11_542_structural_parity::structural_parity_backends_emit_the_same_tooltip_surface_set: 542      # ask 1
  ms11_542_structural_parity::structural_parity_tooltip_surface_encloses_its_text_on_every_side: 542 # #541
  ms11_542_structural_parity::structural_parity_tooltip_surface_shape_agrees_across_unit_systems: 542 # ask 4
  # tier B ratchet half — `AppShell` already registers this chrome on both
  # backends, so this is green today and guards it from regressing while
  # #542 reworks the surface-recording path (ask 3).
  ms11_542_structural_parity::structural_parity_shell_chrome_surface_set_agrees_across_backends: 542
  #
  # #492's slice (contract §5) is unauthored so far.

# ── Red by design, right now (#2164) ──────────────────────────────────────
# Test-ids here are ALLOWED to fail: their fix does not exist yet. A listed
# id that PASSES is a hard, loud failure instead — the vacuous-assertion
# case (#1965). Read by `coord acceptance run --all --ci`; cleared
# automatically by the post-merge sweep when the issue's fix lands.
#
# Hand-written by the coordinator, 2026-08-13. The test-author that authored
# this slice was never told this registry exists (coord/test_author.py has
# no notion of `expected_red`), so nothing populated it — see the #2164
# follow-on. Until that ships, every slice needs this block added by hand
# before it can merge.
#
# ONLY the four tier-B clauses are listed. Deliberately absent:
#   - both `behavioural_parity_*` — tier A, the CONTROL half. Green today and
#     green after the fix; a backend that drops the tooltip border still
#     passes them, which is precisely the gap #542 reports (contract §4b).
#     Listing them would erase the distinction the two tiers exist to draw.
#   - `structural_parity_shell_chrome_surface_set_agrees_across_backends` —
#     the ratchet half. `AppShell` already registers this chrome on both
#     backends, so it is green today and must STAY green while #542 reworks
#     the surface-recording path (ask 3). It is a regression guard, not a
#     pending fix.
expected_red:
  542:
    - ms11_542_structural_parity::structural_parity_every_backend_reports_the_tooltip_surface
    - ms11_542_structural_parity::structural_parity_backends_emit_the_same_tooltip_surface_set
    - ms11_542_structural_parity::structural_parity_tooltip_surface_encloses_its_text_on_every_side
    - ms11_542_structural_parity::structural_parity_tooltip_surface_shape_agrees_across_unit_systems

