[package]
name = "vt100"
version = "0.16.2"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.70"

description = "Library for parsing terminal data"
homepage = "https://github.com/doy/vt100-rust"
repository = "https://github.com/doy/vt100-rust"
readme = "README.md"
keywords = ["terminal", "vt100"]
categories = ["command-line-interface", "encoding"]
license = "MIT"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

# PATCHED for quadraui#452: unicode-width loosened from upstream's "0.2.1" to
# "0.2" (no source changes — vt100 only uses the UnicodeWidthChar trait,
# stable API since unicode-width 0.2.0). Upstream's ^0.2.1 floor is
# incompatible with any consumer that exactly-pins unicode-width to 0.2.0
# (e.g. ratatui 0.29, which vimcode's Cargo.toml pins directly). See
# vendor/vt100-0.16.2-patched/README-PATCH.md for the full rationale.
[dependencies]
itoa = "1.0.15"
unicode-width = "0.2"
vte = "0.15.0"

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
quickcheck = "1.0"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
terminal_size = "0.4.2"
